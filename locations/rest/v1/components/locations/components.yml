components:
  schemas:
    CreateLocationRequest:
      type: object
      description: >
        Request payload for creating a new location.
        The tenant is automatically resolved from the JWT token (claim: tenant_name).
        The location name must be unique within the tenant.
        In MVP, only locationTypeId 1 (STORE) and 2 (STORE_WAREHOUSE) are allowed.
      required:
        - name
        - locationTypeId
        - latitude
        - longitude
      properties:
        name:
          type: string
          description: Name of the location. Must be unique per tenant.
          minLength: 1
          maxLength: 200
          example: "Tienda Centro Madrid"
        locationTypeId:
          type: integer
          format: int32
          description: >
            Identifier of the location type. FK to location_types.
            MVP allows only STORE (1) and STORE_WAREHOUSE (2).
            WAREHOUSE (3) is reserved for future use.
          example: 1
        address:
          type: string
          description: Physical address of the location.
          maxLength: 500
          example: "Gran Vía 25, 28013 Madrid"
        description:
          type: string
          description: Optional free-text description of the location.
          maxLength: 1000
          example: "Tienda principal"
        latitude:
          type: number
          format: double
          description: Geographic latitude of the location in decimal degrees (WGS84).
          minimum: -90
          maximum: 90
          example: 40.4168
        longitude:
          type: number
          format: double
          description: Geographic longitude of the location in decimal degrees (WGS84).
          minimum: -180
          maximum: 180
          example: -3.7038

    CreateLocationResponse:
      type: object
      description: Response containing the unique identifier of the newly created location.
      properties:
        id:
          type: integer
          format: int32
          description: Unique identifier for the created location.
          example: 5

    LocationTypeSummary:
      type: object
      description: Lightweight representation of a location type.
      required:
        - id
        - name
      properties:
        id:
          type: integer
          format: int32
          description: Unique numeric identifier for the location type.
          example: 1
        name:
          type: string
          description: Name or code of the location type (e.g., STORE, STORE_WAREHOUSE, WAREHOUSE).
          minLength: 1
          maxLength: 255
          example: "STORE"

    # ──────────────────────────────────────────────
    # Search Locations schemas
    # ──────────────────────────────────────────────

    SearchLocationsRequest:
      type: object
      description: >
        Search criteria and pagination parameters for querying locations.
        All filter fields are optional. When omitted, no filter is applied for that field.
        Results are paginated using page/size.
      required:
        - page
        - size
      properties:
        filters:
          $ref: '#/components/schemas/LocationSearchFilters'
        page:
          type: integer
          format: int32
          description: Zero-based page index. The first page is 0.
          minimum: 0
          default: 0
          example: 0
        size:
          type: integer
          format: int32
          description: Number of items per page. Must be between 1 and 100.
          minimum: 1
          maximum: 100
          default: 20
          example: 20
        sort:
          type: array
          description: List of sort criteria to apply in order. Each item specifies a field and direction.
          items:
            $ref: '#/components/schemas/SortCriteria'
          example:
            - field: "name"
              direction: "ASC"

    SortCriteria:
      type: object
      description: A single sort criterion specifying a field and direction.
      required:
        - field
        - direction
      properties:
        field:
          type: string
          description: Field name to sort by.
          enum:
            - name
            - locationType
          example: "name"
        direction:
          type: string
          description: Sort direction.
          enum:
            - ASC
            - DESC
          example: "ASC"

    LocationSearchFilters:
      type: object
      description: >
        Optional filter criteria for searching locations.
        All fields are optional — omit a field to skip that filter.
      properties:
        keyword:
          type: string
          description: >
            Free-text search term. Performs a case-insensitive partial match (ILIKE)
            across location name and address fields.
          maxLength: 255
          example: "Madrid"
        locationTypeId:
          type: integer
          format: int32
          description: Filter by location type identifier.
          example: 1
        active:
          type: boolean
          description: Filter by active status.
          example: true

    SearchLocationsResponse:
      type: object
      description: Paginated search results for locations.
      required:
        - page
        - size
        - totalPages
        - totalItems
        - items
      properties:
        page:
          type: integer
          format: int32
          description: Current page index (zero-based).
          example: 0
        size:
          type: integer
          format: int32
          description: Number of items per page.
          example: 20
        totalPages:
          type: integer
          format: int32
          description: Total number of pages available.
          example: 1
        totalItems:
          type: integer
          format: int64
          description: Total number of items matching the search criteria.
          example: 3
        items:
          type: array
          description: List of locations matching the search criteria for the current page.
          items:
            $ref: '#/components/schemas/LocationSummary'

    LocationSummary:
      type: object
      description: Lightweight representation of a location for search result listings.
      required:
        - id
        - name
        - locationType
        - active
      properties:
        id:
          type: integer
          format: int32
          description: Unique identifier of the location.
          example: 5
        name:
          type: string
          description: Name of the location.
          maxLength: 200
          example: "Tienda Centro Madrid"
        locationType:
          $ref: '#/components/schemas/LocationTypeSummary'
        address:
          type: string
          description: Physical address of the location.
          maxLength: 500
          example: "Gran Vía 25, 28013 Madrid"
        active:
          type: boolean
          description: Whether the location is currently active.
          example: true
        latitude:
          type: number
          format: double
          description: Geographic latitude of the location in decimal degrees (WGS84).
          minimum: -90
          maximum: 90
          example: 40.4168
        longitude:
          type: number
          format: double
          description: Geographic longitude of the location in decimal degrees (WGS84).
          minimum: -180
          maximum: 180
          example: -3.7038
