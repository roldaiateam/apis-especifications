<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tenants REST API - Snapshot Version</title>
    <link rel="stylesheet" type="text/css" href="../../swagger-ui/swagger-ui.css" />
    <link rel="icon" type="image/png" href="../../swagger-ui/favicon-32x32.png" sizes="32x32" />
    <style>
        html {
            box-sizing: border-box;
            overflow: -moz-scrollbars-vertical;
            overflow-y: scroll;
        }

        *,
        *:before,
        *:after {
            box-sizing: inherit;
        }

        body {
            margin: 0;
            padding: 0;
        }

        .topbar {
            background-color: #ffc107;
            padding: 10px 0;
        }

        .topbar-wrapper {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1460px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .topbar .link {
            color: #333;
            text-decoration: none;
            font-size: 1.5em;
            font-weight: bold;
        }

        .topbar .link:hover {
            text-decoration: underline;
        }

        .version-badge {
            background: #ff9800;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.9em;
            display: inline-block;
        }

        .back-link {
            background: rgba(0, 0, 0, 0.1);
            color: #333;
            padding: 8px 16px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: 600;
            transition: background 0.3s ease;
        }

        .back-link:hover {
            background: rgba(0, 0, 0, 0.2);
        }

        .warning-banner {
            background: #fff3cd;
            border-left: 4px solid #ff9800;
            padding: 15px;
            margin: 0;
            color: #856404;
            text-align: center;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="topbar">
        <div class="topbar-wrapper">
            <a href="../../" class="link">API Contracts Catalog</a>
            <div>
                <span class="version-badge">SNAPSHOT</span>
                <a href="../../" class="back-link">← Back to Catalog</a>
            </div>
        </div>
    </div>

    <div class="warning-banner">
        ⚠️ This is a SNAPSHOT version from the develop branch - not intended for production use
    </div>
    <div id="swagger-ui"></div>

    <script src="../../swagger-ui/swagger-ui-bundle.js" charset="UTF-8"></script>
    <script src="../../swagger-ui/swagger-ui-standalone-preset.js" charset="UTF-8"></script>
    <script>
        window.onload = function() {
            // Always use relative path since we copy the spec files to docs/
            const specUrl = "./openapi-rest.yml";

            const ui = SwaggerUIBundle({
                url: specUrl,
                dom_id: '#swagger-ui',
                deepLinking: true,
                presets: [
                    SwaggerUIBundle.presets.apis,
                    SwaggerUIStandalonePreset
                ],
                plugins: [
                    SwaggerUIBundle.plugins.DownloadUrl
                ],
                layout: "StandaloneLayout",
                defaultModelsExpandDepth: 1,
                defaultModelExpandDepth: 1,
                docExpansion: "list",
                filter: true,
                showRequestHeaders: true,
                tryItOutEnabled: true,
                validatorUrl: null // Disable validator to avoid CORS issues with $ref
            });

            window.ui = ui;
        };
    </script>
</body>
</html>
