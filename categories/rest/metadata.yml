---
api-spec-type: rest

api:
  name: Categories REST API
  version: 0.0.2
  description: >
    This API provides endpoints that allow tenants to manage category information within the system.
    It enables operations such as creating new categories and managing category data.
  maintainer:
    name: Andrés Reinaldo Cid
    email: andresrc345@gmail.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  basePath: /api/categories
  contact:
    name: Roldaia Team
    email: roldaiateam@gmail.com
  documentation:
    url: ./README.md

openapi:
  spec-version: 3.0.3
  spec-file: openapi-rest.yml
  format: openapi

codegen:
  package-prefix: com.proactivedevs.contracts.categories.rest.v1
  model-package: com.proactivedevs.contracts.categories.rest.v1.model

# Generator configurations
generators:
  mvn:
    enabled: true
    package_name: com.proactivedevs.contracts.categories.rest.v1
    artifact_id_override: null  # Use default naming
  npm:
    enabled: false  # Future implementation
    package_name: "@proactivedevs/contracts-categories-rest"
  go:
    enabled: false  # Future implementation
  python:
    enabled: false  # Future implementation
