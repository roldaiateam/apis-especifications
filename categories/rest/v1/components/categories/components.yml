components:
  schemas:
    CreateCategoryRequest:
      type: object
      properties:
        name:
          type: string
          description: Name of the category
          minLength: 2
          maxLength: 100
          pattern: "^[A-Za-zÁÉÍÓÚáéíóúÑñ0-9 &.\\-]+$"
          example: "Electronics"
        description:
          type: string
          description: Description of the category
          maxLength: 500
          example: "All electronic devices and accessories"
        parentCategoryId:
          type: integer
          format: int64
          description: Identifier of the parent category for hierarchical classification
          example: 1

    CreateCategoryResponse:
      type: object
      properties:
        categoryId:
          type: integer
          format: int64
          description: Unique identifier for the created category
          example: 42

    GetCategoriesResponse:
      type: object
      properties:
        categories:
          type: array
          description: List of categories available in the system for the tenant
          items:
            $ref: '#/components/schemas/CategorySummary'

    CategoryBasic:
      type: object
      description: Basic category information without nested subcategories
      required:
        - id
        - name
      properties:
        id:
          $ref: '#/components/schemas/CategoryId'
        name:
          type: string
          description: Name of the category
          example: "Electronics"
        description:
          type: string
          description: Description of the category
          example: "All electronic devices and accessories"

    CategorySummary:
      type: object
      description: Summary information about a category with one level of subcategories
      required:
        - id
        - name
      properties:
        id:
          $ref: '#/components/schemas/CategoryId'
        name:
          type: string
          description: Name of the category
          example: "Electronics"
        description:
          type: string
          description: Description of the category
          example: "All electronic devices and accessories"
        subcategories:
          type: array
          description: Subcategories of the category
          items:
            $ref: "#/components/schemas/CategoryBasic"
          default: []
          example:
            - id: 2
              name: "Headphones"
              description: "Audio devices"
            - id: 3
              name: "Smartphones"
              description: "Mobile devices"

    CategoryId:
      type: integer
      format: int64
      description: Unique identifier for the category
      example: 42