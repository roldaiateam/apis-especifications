components:
  schemas:
    CreateCategoryRequest:
      type: object
      properties:
        name:
          type: string
          description: Name of the category
          minLength: 2
          maxLength: 100
          pattern: "^[A-Za-zÁÉÍÓÚáéíóúÑñ0-9 &.\\-]+$"
          example: "Electronics"
        description:
          type: string
          description: Description of the category
          maxLength: 500
          example: "All electronic devices and accessories"
        parentCategoryId:
          type: integer
          format: int64
          description: Identifier of the parent category for hierarchical classification
          example: 1

    CreateCategoryResponse:
      type: object
      properties:
        categoryId:
          type: integer
          format: int64
          description: Unique identifier for the created category
          example: 42

    GetCategoriesResponse:
      type: object
      properties:
        categories:
          type: array
          description: List of categories available in the system for the tenant
          items:
            $ref: '#/components/schemas/CategorySummary'

    CategorySummary:
      type: object
      description: Category with nested subcategories (recursive structure)
      required:
        - id
        - name
      properties:
        id:
          $ref: '#/components/schemas/CategoryId'
        name:
          type: string
          description: Name of the category
          example: "Electronics"
        description:
          type: string
          description: Description of the category
          example: "All electronic devices and accessories"
        subcategories:
          type: array
          description: Nested subcategories (recursive)
          items:
            $ref: '#/components/schemas/CategorySummary'
          default: []
          example:
            categories:
              - id: 1
                name: "Electronics"
                description: "All electronic devices and accessories"
                subcategories:
                  - id: 2
                    name: "Computers"
                    description: "Computing devices"
                    subcategories:
                      - id: 3
                        name: "Laptops"
                        description: "Portable computers"
                        subcategories:
                          - id: 4
                            name: "Gaming Laptops"
                            description: "High performance laptops for gaming"
                            subcategories: [ ]
                          - id: 5
                            name: "Ultrabooks"
                            description: "Lightweight laptops"
                            subcategories: [ ]
                      - id: 6
                        name: "Desktops"
                        description: "Desktop computers"
                        subcategories: [ ]
                  - id: 7
                    name: "Mobile Devices"
                    description: "Phones and tablets"
                    subcategories:
                      - id: 8
                        name: "Smartphones"
                        description: "Mobile phones"
                        subcategories:
                          - id: 9
                            name: "Android Phones"
                            description: "Android-based smartphones"
                            subcategories: [ ]
                          - id: 10
                            name: "iPhones"
                            description: "Apple smartphones"
                            subcategories: [ ]

    CategoryId:
      type: integer
      format: int64
      description: Unique identifier for the category
      example: 11