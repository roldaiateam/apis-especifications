---
api-spec-type: websocket

api:
  name: Tenants Websockets
  version: 0.0.1
  description: >
    AsyncAPI specification for Tenants domain WebSocket events.
    Streams provisioning status updates to connected clients using Avro serialization.
  maintainer:
    name: Andrés Reinaldo Cid
    email: andresrc345@gmail.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  contact:
    name: Roldaia Team
    email: roldaiateam@gmail.com
  documentation:
    url: ./README.md

asyncapi:
  spec-version: 3.0.0
  spec-file: asyncapi.yml
  format: avro

messaging:
  protocol: wss
  description: WebSocket Secure connection for real-time provisioning updates

avro:
  schema-version: v1
  schema-path: tenants-avro/v1
  namespace: com.proactivedevs.contracts.tenants.websocket.v1

events:
  - name: TenantProvisioningStatusEvent
    channel: /ws/tenants/{tenantId}/provisioning-status
    description: Streams provisioning status updates for a specific tenant
    schema: tenant-provisioning-status-envelope.avsc