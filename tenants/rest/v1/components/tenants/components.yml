components:
  schemas:
    CreateTenantRequest:
      type: object
      properties:
        firstName:
          type: string
          description: First name of the user
          minLength: 2
          maxLength: 50
          example: "John Doe"
        lastName:
          type: string
          description: Last name of the user
          minLength: 4
          maxLength: 100
          example: "Smith"
        email:
          type: string
          format: email
          description: Email address of the user
          maxLength: 255
          example: "john.doe@example.com"
        password:
          type: string
          description: Password for the user account
          minLength: 8
          maxLength: 100
          example: "P@ssw0rd!"
        phoneNumber:
          type: string
          description: Phone number of the user
          minLength: 10
          maxLength: 15
          example: "+34633852671"
        companyName:
          type: string
          description: Company name of the tenant
          minLength: 4
          maxLength: 100
          example: "Acme Corporation"
        companyTin:
          type: string
          description: Tax Identification Number of the company
          minLength: 9
          maxLength: 9
          example: "123456789"
      required:
        - firstName
        - lastName
        - email
        - password
        - companyName
        - companyTin
    
    CreateTenantResponse:
      type: object
      properties:
        tenantId:
          type: integer
          format: int64
          description: Unique identifier for the tenant
          example: "123e4567-e89b-12d3-a456-426614174000"
        token:
          type: string
          description: Authentication token for the newly created tenant
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
