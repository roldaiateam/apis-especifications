post:
  tags:
    - Tenants
  summary: Create a new tenant
  description: Creates a new tenant in the system with the provided user information
  operationId: createTenant
  requestBody:
    description: User data for creating a new tenant
    required: true
    content:
      application/json:
        schema:
          $ref: '../../components/tenants/components.yml#/components/schemas/CreateTenantRequest'
  responses:
    "201":
      description: tenant created successfully
      content:
        application/json:
          schema:
            $ref: "../../components/tenants/components.yml#/components/schemas/CreateTenantResponse"
    '400':
      $ref: '../../components/errors/components.yml#/components/responses/BadRequest'
    '401':
      $ref: '../../components/errors/components.yml#/components/responses/Unauthorized'
    '403':
      $ref: '../../components/errors/components.yml#/components/responses/Forbidden'
    '409':
      $ref: '../../components/errors/components.yml#/components/responses/Conflict'
    '500':
      $ref: '../../components/errors/components.yml#/components/responses/InternalServerError'
delete:
  tags:
      - Tenants
  summary: Delete a tenant
  description: Deletes an existing tenant from the system using the provided tenant ID
  operationId: deleteTenant
  parameters:
    - name: tenantId
      in: path
      description: ID of the tenant to be deleted
      required: true
      schema:
        type: string
  responses:
    "204":
      description: tenant deleted successfully
    '400':
      $ref: '../../components/errors/components.yml#/components/responses/BadRequest'
    '401':
      $ref: '../../components/errors/components.yml#/components/responses/Unauthorized'
    '403':
     $ref: '../../components/errors/components.yml#/components/responses/Forbidden'
    '404':
     $ref: '../../components/errors/components.yml#/components/responses/NotFound'
    '500':
     $ref: '../../components/errors/components.yml#/components/responses/InternalServerError'