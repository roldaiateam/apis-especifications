---
name: "Tenants Events"
api-spec-type: event
format: avro
version: 1.0.2

description: |
  AsyncAPI specification for Tenants domain events.
  Published to RabbitMQ using Avro serialization.

messaging:
  broker: rabbitmq
  protocol: amqp
  exchange:
    name: tenants.events
    type: topic
    durable: true
    auto-delete: false
  routing-keys:
    - tenant.created
    - tenant.updated
    - tenant.deleted
  content-type: application/vnd.apache.avro+json

avro:
  schema-version: v1
  schema-path: tenants-avro/v1
  namespace: com.proactivedevs.contracts.tenants.v1

events:
  - name: TenantCreated
    routing-key: tenant.created
    description: Published when a new tenant is created
    schema: tenant-created-envelope.avsc
    fields:
      - eventId: UUID of the event
      - eventType: Always "tenant.created"
      - timestamp: ISO 8601 timestamp
      - tenantId: ID of the created tenant
      - tenantName: Name of the tenant
      - userName: Name of the user who created the tenant

maven:
  groupId: com.proactivedevs.contracts
  artifactId: tenants-event
