---
api-spec-type: event

api:
  name: Tenants Events
  version: 1.0.3
  description: >
    AsyncAPI specification for Tenants domain events.
    Published to RabbitMQ using Avro serialization for tenant lifecycle events.
  maintainer:
    name: Andrés Reinaldo Cid
    email: andresrc345@gmail.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  contact:
    name: Roldaia Team
    email: roldaiateam@gmail.com
  documentation:
    url: ./README.md

asyncapi:
  spec-version: 2.6.0
  spec-file: asyncapi.yml
  format: avro

messaging:
  broker: rabbitmq
  protocol: amqp
  exchange:
    name: tenants.events
    type: topic
    durable: true

avro:
  schema-version: v1
  schema-path: tenants-avro/v1
  namespace: com.proactivedevs.contracts.tenants.v1

events:
  - name: TenantCreated
    routing-key: tenant.created
    description: Published when a new tenant is created
    schema: tenant-created-envelope.avsc

