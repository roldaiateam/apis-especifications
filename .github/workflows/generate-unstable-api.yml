name: Generate Unstable API

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  packages: write
  pull-requests: write

jobs:
  generate-unstable:
    if: github.event.issue.pull_request && contains(github.event.comment.body, '/generate-api')
    runs-on: ubuntu-latest

    steps:
      - name: React to comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'rocket'
            });

      - name: Post initial progress comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const comment = `## 🚀 Generando Versión Unstable
            
            Tu solicitud está siendo procesada...
            
            📋 **Estado:** En progreso
            🔗 **Logs del workflow:** [Ver ejecución](${runUrl})
            
            _Este comentario se actualizará cuando el proceso termine._
            `;
            
            const { data: newComment } = await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: comment
            });
            
            // Save comment ID for later update
            core.setOutput('comment_id', newComment.id);

      - name: Parse command arguments
        id: parse-args
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          echo "Comment body: $COMMENT_BODY"
          
          # Extract --name argument
          API_NAME=$(echo "$COMMENT_BODY" | grep -oP '(?<=--name\s")[^"]+' || echo "")
          if [ -z "$API_NAME" ]; then
            API_NAME=$(echo "$COMMENT_BODY" | grep -oP "(?<=--name\s')[^']+" || echo "")
          fi
          
          if [ -z "$API_NAME" ]; then
            echo "❌ Could not parse --name argument"
            echo "error=missing-name" >> $GITHUB_OUTPUT
            exit 1
          fi
          
          echo "api_name=$API_NAME" >> $GITHUB_OUTPUT
          echo "📋 API Name: $API_NAME"
          
          # Extract --type argument (generator type: mvn, npm, go, python)
          # Default to "all" if not specified
          GENERATOR_TYPE=$(echo "$COMMENT_BODY" | grep -oP '(?<=--type\s)\w+' || echo "all")
          echo "generator_type=$GENERATOR_TYPE" >> $GITHUB_OUTPUT
          echo "🔧 Generator type: $GENERATOR_TYPE"

          # Note: Validation of generator type will be done later after checkout
          # when we can access .github/generators/registry.yml

      - name: Get PR details
        id: pr-details
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            
            console.log('PR head ref:', pr.head.ref);
            console.log('PR head sha:', pr.head.sha);
            
            core.setOutput('head_ref', pr.head.ref);
            core.setOutput('head_sha', pr.head.sha);
            return pr.head.ref;

      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr-details.outputs.head_sha }}
          fetch-depth: 0

      - name: Install dependencies
        run: |
          echo "=================================================="
          echo "INSTALLING DEPENDENCIES"
          echo "=================================================="

          # Install yq for YAML parsing
          echo "Installing yq..."
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          yq --version

          # Install Python dependencies for template rendering
          echo "Installing Python dependencies..."
          pip install pyyaml jinja2

          echo "✅ All dependencies installed successfully"

      - name: Find module by API name
        id: find-module
        env:
          API_NAME: ${{ steps.parse-args.outputs.api_name }}
        run: |
          echo "=================================================="
          echo "FINDING MODULE FOR API: $API_NAME"
          echo "=================================================="
          
          # Read root metadata.yml
          if [ ! -f "metadata.yml" ]; then
            echo "❌ Root metadata.yml not found"
            echo "error=no-root-metadata" >> $GITHUB_OUTPUT
            exit 1
          fi
          
          # Parse YAML to find the definition-path for the given name
          MODULE_PATH=$(yq eval ".apis[] | select(.name == \"$API_NAME\") | .\"definition-path\"" metadata.yml)
          
          if [ -z "$MODULE_PATH" ] || [ "$MODULE_PATH" = "null" ]; then
            echo "❌ No module found with name: $API_NAME"
            echo "Available APIs:"
            yq eval '.apis[].name' metadata.yml
            echo "error=api-not-found" >> $GITHUB_OUTPUT
            exit 1
          fi
          
          echo "✅ Found module path: $MODULE_PATH"
          echo "module_path=$MODULE_PATH" >> $GITHUB_OUTPUT

      - name: Validate generator type
        id: validate-generator
        env:
          GENERATOR_TYPE: ${{ steps.parse-args.outputs.generator_type }}
        run: |
          echo "=================================================="
          echo "VALIDATING GENERATOR TYPE"
          echo "=================================================="

          echo "Requested generator type: $GENERATOR_TYPE"

          if [ "$GENERATOR_TYPE" != "all" ]; then
            # Check if generator exists and is enabled in registry
            GENERATOR_EXISTS=$(yq eval ".generators.$GENERATOR_TYPE.enabled // false" .github/generators/registry.yml)

            if [ "$GENERATOR_EXISTS" != "true" ]; then
              echo "❌ Generator '$GENERATOR_TYPE' not found or not enabled in registry"
              echo "Available generators:"
              yq eval '.generators | to_entries | map(select(.value.enabled == true)) | .[].key' .github/generators/registry.yml
              echo "error=invalid-generator" >> $GITHUB_OUTPUT
              exit 1
            fi

            echo "✅ Generator '$GENERATOR_TYPE' is valid and enabled"
          else
            echo "✅ Will use all enabled generators for this module"
          fi

      - name: Extract API version and metadata
        id: extract-version
        env:
          MODULE_PATH: ${{ steps.find-module.outputs.module_path }}
        run: |
          echo "=================================================="
          echo "EXTRACTING VERSION FROM MODULE: $MODULE_PATH"
          echo "=================================================="
          
          # Read module metadata.yml
          METADATA_FILE="$MODULE_PATH/metadata.yml"
          if [ ! -f "$METADATA_FILE" ]; then
            echo "❌ Module metadata.yml not found at $METADATA_FILE"
            echo "error=no-module-metadata" >> $GITHUB_OUTPUT
            exit 1
          fi
          
          # Determine API spec type
          API_SPEC_TYPE=$(grep '^api-spec-type:' "$METADATA_FILE" | awk '{print $2}' | tr -d '"' | tr -d "'")
          echo "📋 API spec type: $API_SPEC_TYPE"
          
          # Determine spec file based on type
          if [ "$API_SPEC_TYPE" = "event" ] || [ "$API_SPEC_TYPE" = "websocket" ]; then
            SPEC_FILE="$MODULE_PATH/asyncapi.yml"
          elif [ "$API_SPEC_TYPE" = "rest" ]; then
            SPEC_FILE="$MODULE_PATH/openapi-rest.yml"
          else
            echo "❌ Unknown api-spec-type: $API_SPEC_TYPE"
            echo "error=unknown-spec-type" >> $GITHUB_OUTPUT
            exit 1
          fi
          
          if [ ! -f "$SPEC_FILE" ]; then
            echo "❌ Spec file not found: $SPEC_FILE"
            echo "error=no-spec-file" >> $GITHUB_OUTPUT
            exit 1
          fi
          
          echo "📄 Spec file: $SPEC_FILE"
          
          # Extract API version from spec file
          API_VERSION=$(grep -A 10 '^info:' "$SPEC_FILE" | grep -E '^[[:space:]]+version:' | head -n 1 | sed 's/.*version:[[:space:]]*//' | tr -d '"' | tr -d "'")
          
          if [ -z "$API_VERSION" ]; then
            echo "❌ Could not extract API version from $SPEC_FILE"
            echo "error=no-api-version" >> $GITHUB_OUTPUT
            exit 1
          fi
          
          echo "✅ API version: $API_VERSION"
          echo "api_version=$API_VERSION" >> $GITHUB_OUTPUT
          echo "spec_type=$API_SPEC_TYPE" >> $GITHUB_OUTPUT

      - name: Compute unstable version and artifact ID
        id: compute-unstable
        env:
          MODULE_PATH: ${{ steps.find-module.outputs.module_path }}
          API_VERSION: ${{ steps.extract-version.outputs.api_version }}
          HEAD_REF: ${{ steps.pr-details.outputs.head_ref }}
        run: |
          echo "=================================================="
          echo "COMPUTING UNSTABLE VERSION"
          echo "=================================================="
          
          # Sanitize branch name (replace / with -)
          BRANCH_NAME=$(echo "$HEAD_REF" | sed 's/\//-/g')
          echo "📋 Sanitized branch name: $BRANCH_NAME"
          
          # Compute unstable version: {api-version}-{branch-name}-SNAPSHOT
          UNSTABLE_VERSION="${API_VERSION}-${BRANCH_NAME}-SNAPSHOT"
          echo "📦 Unstable version: $UNSTABLE_VERSION"
          echo "unstable_version=$UNSTABLE_VERSION" >> $GITHUB_OUTPUT
          
          # Compute artifact IDs
          MODULE_NAME=$(echo "$MODULE_PATH" | tr '/' '-')
          STABLE_ARTIFACT_ID="${MODULE_NAME}-stable"
          UNSTABLE_ARTIFACT_ID="${MODULE_NAME}-unstable"
          
          echo "📦 Stable artifact ID: $STABLE_ARTIFACT_ID"
          echo "📦 Unstable artifact ID: $UNSTABLE_ARTIFACT_ID"
          
          echo "stable_artifact_id=$STABLE_ARTIFACT_ID" >> $GITHUB_OUTPUT
          echo "unstable_artifact_id=$UNSTABLE_ARTIFACT_ID" >> $GITHUB_OUTPUT

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          # cache removed: POMs no longer exist in repo after Maven decoupling
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Generate and deploy unstable with generators
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODULE_PATH: ${{ steps.find-module.outputs.module_path }}
          GENERATOR_TYPE: ${{ steps.parse-args.outputs.generator_type }}
          UNSTABLE_VERSION: ${{ steps.compute-unstable.outputs.unstable_version }}
          BRANCH_NAME: ${{ steps.pr-details.outputs.head_ref }}
        run: |
          set -e

          echo "=================================================="
          echo "GENERATING UNSTABLE API WITH GENERATORS"
          echo "=================================================="
          echo "Module: $MODULE_PATH"
          echo "Generator type: $GENERATOR_TYPE"
          echo "Unstable version: $UNSTABLE_VERSION"
          echo "Branch: $BRANCH_NAME"
          echo "=================================================="

          # Extract module metadata
          METADATA_FILE="$MODULE_PATH/metadata.yml"

          # Determine which generators to use
          if [ "$GENERATOR_TYPE" = "all" ]; then
            # Get all enabled generators for this module
            echo "🔍 Finding all enabled generators for this module..."
            GENERATORS=$(yq eval '.generators | to_entries | map(select(.value.enabled == true)) | .[].key' "$METADATA_FILE")

            if [ -z "$GENERATORS" ]; then
              echo "❌ No generators enabled for this module"
              exit 1
            fi
          else
            # Check if specific generator is enabled for this module
            echo "🔍 Checking if $GENERATOR_TYPE generator is enabled for this module..."
            IS_ENABLED=$(yq eval ".generators.$GENERATOR_TYPE.enabled // false" "$METADATA_FILE")

            if [ "$IS_ENABLED" != "true" ]; then
              echo "❌ Generator '$GENERATOR_TYPE' is not enabled for this module"
              echo "Available generators for this module:"
              yq eval '.generators | to_entries | map(select(.value.enabled == true)) | .[].key' "$METADATA_FILE"
              exit 1
            fi

            GENERATORS="$GENERATOR_TYPE"
          fi

          echo ""
          echo "📋 Generators to use: $GENERATORS"
          echo ""

          # Store generators list for later use in success comment
          echo "$GENERATORS" > /tmp/generators_used.txt

          # Generate and deploy with each generator
          for GEN in $GENERATORS; do
            echo "=================================================="
            echo "🚀 Generating with $GEN generator"
            echo "=================================================="

            # Call generator script with unstable stability and version override
            bash scripts/generators/generate-${GEN}.sh \
              "$MODULE_PATH" \
              "unstable" \
              "$UNSTABLE_VERSION" \
              --deploy

            echo ""
            echo "✅ Generated and deployed with $GEN generator"
            echo ""
          done

          echo "=================================================="
          echo "✅ All generators completed successfully"
          echo "=================================================="

      - name: Post success comment
        if: success()
        uses: actions/github-script@v7
        env:
          API_NAME: ${{ steps.parse-args.outputs.api_name }}
          UNSTABLE_ARTIFACT_ID: ${{ steps.compute-unstable.outputs.unstable_artifact_id }}
          UNSTABLE_VERSION: ${{ steps.compute-unstable.outputs.unstable_version }}
          SPEC_TYPE: ${{ steps.extract-version.outputs.spec_type }}
          GENERATOR_TYPE: ${{ steps.parse-args.outputs.generator_type }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const apiName = process.env.API_NAME;
            const artifactId = process.env.UNSTABLE_ARTIFACT_ID;
            const version = process.env.UNSTABLE_VERSION;
            const specType = process.env.SPEC_TYPE;
            const generatorType = process.env.GENERATOR_TYPE;

            // Read generators used from temp file
            let generatorsUsed = '';
            try {
              generatorsUsed = fs.readFileSync('/tmp/generators_used.txt', 'utf8').trim().replace(/\n/g, ', ');
            } catch (error) {
              generatorsUsed = generatorType === 'all' ? 'all enabled' : generatorType;
            }

            const typeLabel = (specType === 'event' || specType === 'websocket') ? 'AsyncAPI' : 'OpenAPI';
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            let comment = `## ✅ Versión Unstable Generada Exitosamente

            ### ${apiName} (${typeLabel})
            **Version:** \`${version}\`
            **Generadores utilizados:** ${generatorsUsed}

            `;

            // Add Maven dependency example if mvn generator was used
            if (generatorsUsed.includes('mvn') || generatorType === 'all') {
              comment += `#### Maven

            Para consumir esta versión unstable en tu proyecto Maven, agrega la siguiente dependencia:

            \`\`\`xml
            <dependency>
                <groupId>com.proactivedevs.contracts</groupId>
                <artifactId>${artifactId}</artifactId>
                <version>${version}</version>
            </dependency>
            \`\`\`

            `;
            }

            comment += `---

            ⚠️ **Nota:** Esta es una versión **inestable** generada desde este PR. Será automáticamente eliminada cuando el PR sea mergeado.

            📦 **Ubicación:** [GitHub Packages](https://github.com/${context.repo.owner}/${context.repo.repo}/packages)
            🔗 **Logs del workflow:** [Ver ejecución](${runUrl})
            `;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: comment
            });

      - name: Post error comment
        if: failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            
            const comment = `## ❌ Error al Generar Versión Unstable
            
            Hubo un error al intentar generar la versión unstable de la API.
            
            Por favor, revisa los logs del workflow para más detalles:
            🔗 [Ver logs de ejecución](${runUrl})
            `;
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: comment
            });
