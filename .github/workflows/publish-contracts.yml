name: Publish Contracts

on:
  push:
    branches:
      - main
      - develop

permissions:
  contents: write
  packages: write
  pull-requests: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Detect changed modules
        id: detect-changes
        run: |
          echo "Detecting modules with changes in this push..."

          # For the first push, compare with empty tree
          if git rev-parse HEAD~1 >/dev/null 2>&1; then
            CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD)
          else
            CHANGED_FILES=$(git ls-files)
          fi

          echo "Changed files:"
          echo "$CHANGED_FILES"

          # Find unique module directories that have changes
          # Exclude non-module directories like .github, docs, scripts, etc.
          CHANGED_MODULES=$(echo "$CHANGED_FILES" | \
            grep -E '^[^/]+/[^/]+/' | \
            grep -v -E '^(\.github|docs|scripts|netlify)/' | \
            cut -d'/' -f1-2 | \
            sort -u || true)

          if [ -z "$CHANGED_MODULES" ]; then
            echo "No contract modules changed in this push"
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "modules=" >> $GITHUB_OUTPUT
          else
            echo "Changed modules:"
            echo "$CHANGED_MODULES"
            echo "has_changes=true" >> $GITHUB_OUTPUT
            # Convert to comma-separated list for later use
            MODULES_LIST=$(echo "$CHANGED_MODULES" | tr '\n' ',' | sed 's/,$//')
            echo "modules=$MODULES_LIST" >> $GITHUB_OUTPUT
          fi

      - name: Validate API versions
        if: steps.detect-changes.outputs.has_changes == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODULES: ${{ steps.detect-changes.outputs.modules }}
        run: |
          set -e
          
          VALIDATION_FAILED=0
          ERROR_MESSAGES=""
          
          # Split modules by comma
          IFS=',' read -ra MODULE_ARRAY <<< "$MODULES"
          
          for MODULE_PATH in "${MODULE_ARRAY[@]}"; do
            echo "=================================================="
            echo "Validating module: $MODULE_PATH"
            echo "=================================================="
            
            # Determine API spec type from metadata.yml
            METADATA_FILE="$MODULE_PATH/metadata.yml"
            if [ ! -f "$METADATA_FILE" ]; then
              echo "⚠️  No metadata.yml found in $MODULE_PATH, skipping validation"
              continue
            fi
            
            API_SPEC_TYPE=$(grep '^api-spec-type:' "$METADATA_FILE" | awk '{print $2}' | tr -d '"' | tr -d "'")
            echo "📋 API spec type: $API_SPEC_TYPE"
            
            # Determine spec file based on type
            if [ "$API_SPEC_TYPE" = "event" ] || [ "$API_SPEC_TYPE" = "websocket" ]; then
              SPEC_FILE="$MODULE_PATH/asyncapi.yml"
            elif [ "$API_SPEC_TYPE" = "rest" ]; then
              SPEC_FILE="$MODULE_PATH/openapi-rest.yml"
            else
              echo "❌ Unknown api-spec-type: $API_SPEC_TYPE"
              VALIDATION_FAILED=1
              ERROR_MESSAGES="${ERROR_MESSAGES}\n- ❌ $MODULE_PATH: Unknown api-spec-type"
              continue
            fi
            
            if [ ! -f "$SPEC_FILE" ]; then
              echo "⚠️  No spec file found at $SPEC_FILE, skipping validation"
              continue
            fi
            
            # Extract API version from spec file
            # Use sed to handle both spaces and tabs for indentation
            API_VERSION=$(grep -A 10 '^info:' "$SPEC_FILE" | grep -E '^[[:space:]]+version:' | head -n 1 | sed 's/.*version:[[:space:]]*//' | tr -d '"' | tr -d "'")
            
            if [ -z "$API_VERSION" ]; then
              echo "❌ Could not extract API version from $SPEC_FILE"
              VALIDATION_FAILED=1
              ERROR_MESSAGES="${ERROR_MESSAGES}\n- ❌ $MODULE_PATH: Could not extract API version"
              continue
            fi
            
            echo "📋 API version: $API_VERSION"
            
            # Determine Maven package name
            MODULE_NAME=$(echo "$MODULE_PATH" | tr '/' '-')
            PACKAGE_NAME="com.proactivedevs.contracts.${MODULE_NAME}-stable"
            ENCODED_PACKAGE_NAME=$(echo "$PACKAGE_NAME" | sed 's/\./\%2E/g')
            
            echo "📦 Maven package: $PACKAGE_NAME"
            
            # Query GitHub Packages for existing versions
            OWNER="${{ github.repository_owner }}"
            API_URL="https://api.github.com/users/${OWNER}/packages/maven/${ENCODED_PACKAGE_NAME}/versions"
            RESPONSE=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" "$API_URL" || echo "[]")
            
            if echo "$RESPONSE" | grep -q '"message".*"Not Found"'; then
              echo "✅ First version - validation passed"
              continue
            fi
            
            PUBLISHED_VERSIONS=$(echo "$RESPONSE" | grep -o '"name":"[^"]*"' | cut -d'"' -f4 || echo "")
            
            if [ -z "$PUBLISHED_VERSIONS" ]; then
              echo "✅ No versions published yet - validation passed"
              continue
            fi
            
            echo "📚 Published versions: $PUBLISHED_VERSIONS"
            
            LATEST_STABLE=$(echo "$PUBLISHED_VERSIONS" | grep -v 'SNAPSHOT' | sort -V | tail -n 1 || echo "")
            
            if [ "${{ github.ref }}" = "refs/heads/main" ]; then
              echo "🎯 Publishing to main (stable release)"
              
              if [ -n "$LATEST_STABLE" ]; then
                if [ "$(printf '%s\n' "$LATEST_STABLE" "$API_VERSION" | sort -V | head -n1)" = "$API_VERSION" ] && [ "$API_VERSION" != "$LATEST_STABLE" ]; then
                  echo "❌ Version $API_VERSION is not greater than latest stable $LATEST_STABLE"
                  VALIDATION_FAILED=1
                  ERROR_MESSAGES="${ERROR_MESSAGES}\n- ❌ $MODULE_PATH: Version must be > $LATEST_STABLE"
                elif [ "$API_VERSION" = "$LATEST_STABLE" ]; then
                  echo "❌ Version $API_VERSION already exists"
                  VALIDATION_FAILED=1
                  ERROR_MESSAGES="${ERROR_MESSAGES}\n- ❌ $MODULE_PATH: Version $API_VERSION already released"
                else
                  echo "✅ Version validation passed"
                fi
              else
                echo "✅ First stable version - validation passed"
              fi
            else
              echo "🎯 Publishing to develop (snapshot)"
              echo "✅ Snapshot versions can overwrite - validation passed"
            fi
            
            echo ""
          done
          
          if [ $VALIDATION_FAILED -eq 1 ]; then
            echo "❌ Version validation FAILED"
            echo -e "$ERROR_MESSAGES"
            exit 1
          else
            echo "✅ All validations passed"
          fi

      - name: Sync POM versions from API specs (per module)
        if: steps.detect-changes.outputs.has_changes == 'true'
        env:
          MODULES: ${{ steps.detect-changes.outputs.modules }}
        run: |
           set -e
           
           echo "=================================================="
           echo "SYNCING POM VERSIONS FROM API SPECS (PER MODULE)"
           echo "=================================================="
           
           # Split modules by comma
           IFS=',' read -ra MODULE_ARRAY <<< "$MODULES"
           
           # Clear the temporary file for storing module info
           > /tmp/module_versions.txt
           
           for MODULE_PATH in "${MODULE_ARRAY[@]}"; do
             echo ""
             echo "Processing module: $MODULE_PATH"
             
             METADATA_FILE="$MODULE_PATH/metadata.yml"
             if [ ! -f "$METADATA_FILE" ]; then
               echo "⚠️  No metadata.yml found, skipping"
               continue
             fi
             
             # Extract API spec type
             API_SPEC_TYPE=$(grep '^api-spec-type:' "$METADATA_FILE" | awk '{print $2}' | tr -d '"' | tr -d "'")
             echo "📋 API spec type: $API_SPEC_TYPE"
             
             # Determine spec file based on type
             if [ "$API_SPEC_TYPE" = "event" ] || [ "$API_SPEC_TYPE" = "websocket" ]; then
               SPEC_FILE="$MODULE_PATH/asyncapi.yml"
             elif [ "$API_SPEC_TYPE" = "rest" ]; then
               SPEC_FILE="$MODULE_PATH/openapi-rest.yml"
             else
               echo "⚠️  Unknown api-spec-type, skipping"
               continue
             fi
             
             if [ ! -f "$SPEC_FILE" ]; then
               echo "⚠️  Spec file not found: $SPEC_FILE, skipping"
               continue
             fi
             
             # Extract API version from spec file
             API_VERSION=$(grep -A 10 '^info:' "$SPEC_FILE" | grep -E '^[[:space:]]+version:' | head -n 1 | sed 's/.*version:[[:space:]]*//' | tr -d '"' | tr -d "'")
             
             if [ -z "$API_VERSION" ]; then
               echo "❌ Could not extract API version from $SPEC_FILE"
               exit 1
             fi
             
             echo "📋 API version from spec: $API_VERSION"
             
             # Extract API name from metadata.yml (for later use in PR comment)
             API_NAME=$(grep -A 1 '^api:' "$METADATA_FILE" | grep 'name:' | sed 's/.*name:[[:space:]]*//' | tr -d '"' | tr -d "'")
             echo "📋 API name: $API_NAME"
             
             # Determine target Maven version based on branch
             if [ "${{ github.ref }}" = "refs/heads/main" ]; then
               MAVEN_VERSION="$API_VERSION"
               echo "🎯 Target branch: main → Maven version: $MAVEN_VERSION (stable)"
             else
               MAVEN_VERSION="${API_VERSION}-SNAPSHOT"
               echo "🎯 Target branch: develop → Maven version: $MAVEN_VERSION (snapshot)"
             fi
             
             # Calculate artifact ID
             MODULE_NAME=$(echo "$MODULE_PATH" | tr '/' '-')
             ARTIFACT_ID="${MODULE_NAME}-stable"
             echo "📦 Artifact ID: $ARTIFACT_ID"
             
              # Update ONLY this module's POM version directly with sed
              POM_FILE="$MODULE_PATH/pom.xml"
              echo "🔄 Updating $POM_FILE version to $MAVEN_VERSION"
              
              # Use sed to replace the version line that comes after <artifactId>
              # This pattern looks for <artifactId>...<version>X.Y.Z</version>
              sed -i.bak "/<artifactId>$ARTIFACT_ID<\/artifactId>/,/<version>/ s|<version>[^<]*</version>|<version>$MAVEN_VERSION</version>|" "$POM_FILE"
              rm -f "$POM_FILE.bak"
              
              echo "✅ Updated version in $POM_FILE"
             
             # Store module info for PR comment (append to temp file)
             echo "${MODULE_PATH}|${API_NAME}|${ARTIFACT_ID}|${MAVEN_VERSION}" >> /tmp/module_versions.txt
             
             echo "✅ $ARTIFACT_ID synchronized to $MAVEN_VERSION"
           done
           
           # Sort the module info file alphabetically by module path
           echo "📝 Sorting module info for PR comment generation..."
           sort -o /tmp/module_versions.txt /tmp/module_versions.txt
           
           echo ""
           echo "✅ All POM versions synchronized successfully"

      - name: Build and test
        if: steps.detect-changes.outputs.has_changes == 'true'
        env:
          MODULES: ${{ steps.detect-changes.outputs.modules }}
        run: |
          # Build only changed modules
          IFS=',' read -ra MODULE_ARRAY <<< "$MODULES"
          MODULE_LIST=""
          for MODULE_PATH in "${MODULE_ARRAY[@]}"; do
            if [ -f "$MODULE_PATH/pom.xml" ]; then
              MODULE_NAME=$(echo "$MODULE_PATH" | tr '/' '-')
              ARTIFACT_ID="${MODULE_NAME}-stable"
              if [ -z "$MODULE_LIST" ]; then
                MODULE_LIST=":$ARTIFACT_ID"
              else
                MODULE_LIST="$MODULE_LIST,:$ARTIFACT_ID"
              fi
            fi
          done
          
          if [ -n "$MODULE_LIST" ]; then
            echo "Building modules: $MODULE_LIST"
            mvn clean verify -pl "$MODULE_LIST"
          else
            echo "No valid modules to build"
            exit 1
          fi

      - name: Deploy to GitHub Packages
        if: steps.detect-changes.outputs.has_changes == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODULES: ${{ steps.detect-changes.outputs.modules }}
        run: |
          # Deploy only changed modules
          IFS=',' read -ra MODULE_ARRAY <<< "$MODULES"
          MODULE_LIST=""
          for MODULE_PATH in "${MODULE_ARRAY[@]}"; do
            if [ -f "$MODULE_PATH/pom.xml" ]; then
              MODULE_NAME=$(echo "$MODULE_PATH" | tr '/' '-')
              ARTIFACT_ID="${MODULE_NAME}-stable"
              if [ -z "$MODULE_LIST" ]; then
                MODULE_LIST=":$ARTIFACT_ID"
              else
                MODULE_LIST="$MODULE_LIST,:$ARTIFACT_ID"
              fi
            fi
          done
          
          if [ -n "$MODULE_LIST" ]; then
            echo "Deploying modules: $MODULE_LIST"
            mvn deploy -pl "$MODULE_LIST" -DskipTests
          else
            echo "No valid modules to deploy"
            exit 1
          fi

      - name: Generate dependency info
        if: steps.detect-changes.outputs.has_changes == 'true'
        id: dependency-info
        run: |
          COMMENT="## 📦 Contracts Published Successfully\n\n"
          
          # Read module info from the file created in the previous step
          if [ ! -f /tmp/module_versions.txt ]; then
            echo "⚠️  No module versions file found, skipping PR comment generation"
            exit 0
          fi
          
          # File is already sorted alphabetically by module path
          while IFS='|' read -r MODULE_PATH API_NAME ARTIFACT_ID MAVEN_VERSION; do
            echo "Processing: $API_NAME ($MODULE_PATH)"
            
            # Determine API type label
            if [[ "$MODULE_PATH" == *"/event" ]]; then
              TYPE_LABEL="AsyncAPI (Event)"
            elif [[ "$MODULE_PATH" == *"/websocket" ]]; then
              TYPE_LABEL="AsyncAPI (WebSocket)"
            elif [[ "$MODULE_PATH" == *"/rest" ]]; then
              TYPE_LABEL="OpenAPI"
            else
              TYPE_LABEL="API"
            fi
            
            # Add section for this API
            COMMENT="${COMMENT}### ${API_NAME} (${TYPE_LABEL})\n"
            COMMENT="${COMMENT}**Version:** \`${MAVEN_VERSION}\`\n\n"
            COMMENT="${COMMENT}\`\`\`xml\n"
            COMMENT="${COMMENT}<dependency>\n"
            COMMENT="${COMMENT}    <groupId>com.proactivedevs.contracts</groupId>\n"
            COMMENT="${COMMENT}    <artifactId>${ARTIFACT_ID}</artifactId>\n"
            COMMENT="${COMMENT}    <version>${MAVEN_VERSION}</version>\n"
            COMMENT="${COMMENT}</dependency>\n"
            COMMENT="${COMMENT}\`\`\`\n\n"
          done < /tmp/module_versions.txt
          
          COMMENT="${COMMENT}---\n\n"
          COMMENT="${COMMENT}**📚 Package location:** [GitHub Packages](https://github.com/${{ github.repository }}/packages)\n"
          
          # Save comment to file for the next step
          echo -e "$COMMENT" > /tmp/comment.txt
          
          # Also output for logs
          echo "Generated comment:"
          cat /tmp/comment.txt

      - name: Find PR number and create comment
        if: steps.detect-changes.outputs.has_changes == 'true'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const comment = fs.readFileSync('/tmp/comment.txt', 'utf8');
            
            try {
              // Find PRs associated with this commit
              console.log('Looking for PR associated with commit:', context.sha);
              
              const { data: pulls } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: context.sha
              });
              
              if (pulls.length === 0) {
                console.log('⚠️  No PR found associated with this commit. Skipping comment.');
                console.log('This is normal for direct pushes to develop/main without a PR.');
                return;
              }
              
              // Get the first PR (should be the one that was just merged)
              const pr = pulls[0];
              console.log(`Found PR #${pr.number}: ${pr.title}`);
              
              // Post comment on the PR
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body: comment
              });
              
              console.log(`✅ Comment posted successfully on PR #${pr.number}`);
            } catch (error) {
              console.error('❌ Failed to post PR comment:', error.message);
              console.log('This is not critical - deployment was successful.');
              console.log('Dependency information:');
              console.log(comment);
            }

      - name: Create Git tags (main only)
        if: github.ref == 'refs/heads/main' && steps.detect-changes.outputs.has_changes == 'true'
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          # Read module versions and create individual tags
          while IFS='|' read -r MODULE_PATH API_NAME ARTIFACT_ID MAVEN_VERSION; do
            TAG_NAME="${ARTIFACT_ID}-v${MAVEN_VERSION}"
            echo "Creating tag: $TAG_NAME"
            git tag -a "$TAG_NAME" -m "Release $API_NAME version $MAVEN_VERSION"
            git push origin "$TAG_NAME"
          done < /tmp/module_versions.txt

          echo "✅ All tags created and pushed"

      - name: Prepare artifact for deployment
        run: |
          # Ensure the file exists (create empty if no changes)
          touch /tmp/module_versions.txt
          echo "📦 Artifact content:"
          cat /tmp/module_versions.txt || echo "(empty - no API modules published)"

      - name: Upload published versions artifact
        uses: actions/upload-artifact@v4
        with:
          name: published-versions
          path: /tmp/module_versions.txt
          retention-days: 1
