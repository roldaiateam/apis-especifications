name: Publish Contracts

on:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set version for main branch (stable)
        if: github.ref == 'refs/heads/main'
        run: |
          # Extract current version from pom.xml and remove -SNAPSHOT
          CURRENT_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          STABLE_VERSION=${CURRENT_VERSION%-SNAPSHOT}
          echo "Setting stable version: $STABLE_VERSION"
          mvn versions:set -DnewVersion=$STABLE_VERSION -DgenerateBackupPoms=false
          echo "VERSION=$STABLE_VERSION" >> $GITHUB_ENV

      - name: Set version for develop branch (snapshot)
        if: github.ref == 'refs/heads/develop'
        run: |
          CURRENT_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "Using snapshot version: $CURRENT_VERSION"
          echo "VERSION=$CURRENT_VERSION" >> $GITHUB_ENV

      - name: Build and test
        run: mvn clean verify

      - name: Deploy to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mvn deploy -DskipTests

      - name: Create Git tag (main only)
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git tag -a "v$VERSION" -m "Release version $VERSION"
          git push origin "v$VERSION"
