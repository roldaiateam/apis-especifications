name: Cleanup PR Previews

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout gh-pages-preview branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages-preview
          fetch-depth: 0
        continue-on-error: true

      - name: Stop if branch does not exist
        if: failure()
        run: |
          echo "ℹ️ gh-pages-preview branch does not exist yet"
          exit 0

      - name: Make script executable
        run: chmod +x scripts/cleanup-preview.sh

      - name: Cleanup PR preview
        run: |
          bash scripts/cleanup-preview.sh "${{ github.event.pull_request.number }}"