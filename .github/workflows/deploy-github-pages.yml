name: Deploy to GitHub Pages

on:
  workflow_run:
    workflows: ["Publish Contracts"]
    types: [completed]
    branches: [main, develop]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  deploy:
    # Only run if the previous workflow succeeded
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Restore existing docs from gh-pages
        run: |
          if git ls-remote --heads origin gh-pages | grep -q .; then
            echo "Restoring existing API docs from gh-pages..."
            git fetch origin gh-pages --depth=1
            git checkout FETCH_HEAD -- docs/apis 2>/dev/null \
              || echo "No docs/apis in gh-pages yet (first run)"
          else
            echo "No gh-pages branch yet (first deployment)"
          fi
          mkdir -p docs/apis

      - name: Download published versions artifact
        uses: actions/download-artifact@v4
        with:
          name: published-versions
          path: /tmp
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Check if artifact has content
        id: check-artifact
        run: |
          if [ -f /tmp/module_versions.txt ] && [ -s /tmp/module_versions.txt ]; then
            echo "has_versions=true" >> $GITHUB_OUTPUT
            echo "✅ Found module versions to deploy:"
            cat /tmp/module_versions.txt
          else
            echo "has_versions=false" >> $GITHUB_OUTPUT
            echo "ℹ️  No API modules published - skipping documentation deployment"
            echo "   This is expected when only workflow files or documentation changes"
          fi

      - name: Generate documentation for published APIs
        if: steps.check-artifact.outputs.has_versions == 'true'
        run: |
          echo "🚀 Generating documentation for published APIs..."
          echo "=================================================="

          # Helper function to detect version type
          detect_version_type() {
            local version=$1
            if [[ "$version" =~ -SNAPSHOT$ ]]; then
              echo "snapshot"
            elif [[ "$version" =~ -unstable- ]]; then
              echo "unstable"
            else
              echo "stable"
            fi
          }

          # Helper function to detect API type
          detect_api_type() {
            local path=$1
            if [[ "$path" == *"/event" ]]; then
              echo "event"
            elif [[ "$path" == *"/websocket" ]]; then
              echo "websocket"
            elif [[ "$path" == *"/rest" ]]; then
              echo "rest"
            else
              echo "rest"  # default
            fi
          }

          # Process each published module
          while IFS='|' read -r MODULE_PATH API_NAME ARTIFACT_ID MAVEN_VERSION; do
            echo ""
            echo "📦 Processing: $API_NAME"
            echo "   Path: $MODULE_PATH"
            echo "   Version: $MAVEN_VERSION"

            # Extract API info
            API_ID=$(echo "$MODULE_PATH" | tr '/' '-')
            VERSION="$MAVEN_VERSION"
            TYPE=$(detect_version_type "$VERSION")
            API_TYPE=$(detect_api_type "$MODULE_PATH")
            PUBLISHED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)

            echo "   API ID: $API_ID"
            echo "   Type: $TYPE ($API_TYPE)"
            echo "   Published: $PUBLISHED_AT"

            # Generate docs incrementally
            python scripts/generate-docs.py --mode incremental \
              --api "$API_ID" \
              --api-name "$API_NAME" \
              --api-type "$API_TYPE" \
              --version "$VERSION" \
              --type "$TYPE" \
              --published-at "$PUBLISHED_AT" \
              --source-path "$MODULE_PATH"

            if [ $? -ne 0 ]; then
              echo "❌ Failed to generate docs for $API_ID"
              exit 1
            fi

            echo "✅ Documentation generated for $API_ID v$VERSION"
          done < /tmp/module_versions.txt

          echo ""
          echo "=================================================="
          echo "✅ All API documentations generated successfully"

      - name: Setup Pages
        if: steps.check-artifact.outputs.has_versions == 'true'
        uses: actions/configure-pages@v4

      - name: Upload artifact
        if: steps.check-artifact.outputs.has_versions == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs'

      - name: Deploy to GitHub Pages
        if: steps.check-artifact.outputs.has_versions == 'true'
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Save updated docs to gh-pages
        if: steps.check-artifact.outputs.has_versions == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          REPO_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"

          if git ls-remote --heads origin gh-pages | grep -q .; then
            git clone --branch gh-pages --depth=1 "$REPO_URL" /tmp/gh-pages
          else
            mkdir /tmp/gh-pages
            cd /tmp/gh-pages
            git init
            git remote add origin "$REPO_URL"
            git checkout --orphan gh-pages
            cd -
          fi

          rm -rf /tmp/gh-pages/docs/apis
          mkdir -p /tmp/gh-pages/docs
          cp -r docs/apis /tmp/gh-pages/docs/

          cd /tmp/gh-pages
          git add docs/apis
          if ! git diff --staged --quiet; then
            git commit -m "docs: update API catalog [skip ci]"
            git push origin gh-pages
          fi

      - name: Output deployment URL
        if: steps.check-artifact.outputs.has_versions == 'true'
        run: |
          echo "🚀 Documentation deployed successfully!"
          echo "📄 View at: ${{ steps.deployment.outputs.page_url }}"

      - name: Skip deployment message
        if: steps.check-artifact.outputs.has_versions != 'true'
        run: |
          echo "ℹ️  Skipping documentation deployment"
          echo "   Reason: No API modules were published in this workflow run"
          echo "   This is expected when only infrastructure files changed"
