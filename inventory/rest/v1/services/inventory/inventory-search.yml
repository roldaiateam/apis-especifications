post:
  tags:
    - Inventory
  summary: Search inventory (stock)
  description: >
    Searches and filters the inventory (stock) with pagination and sorting.
    Each result row represents the projected stock of one product in one location
    (Stock_Inventory, the aggregate root) — quantity is the total across all of its batches.
    Batch-level detail is not part of this response; it is planned as a separate, dedicated
    endpoint in the future.
    Returns a paginated list of inventory rows matching the specified filters.
    All filters are optional — an empty request body returns all inventory rows
    with default pagination (page 0, size 20, sorted by quantity ASC — lowest stock first).
    The tenant is automatically resolved from the JWT token (claim: tenant_name).
    Requires role: store_admin.
    Filter rules:
    - productId and locationId, when provided, must reference an existing product/location;
      otherwise the request is rejected with 400 (INVENTORY_SEARCH_VALIDATION).
    - batchCode and expiresWithinDays filter on the row's underlying batch detail even though
      that detail is not returned — a row matches if ANY of its batches satisfies the condition.
    - categoryId filters by the product category.
    - expiresWithinDays: already-expired batches are included; batches with no expiration date
      never match.
    - stockStatus filters on the row total (AVAILABLE = quantity > 0, OUT_OF_STOCK = quantity = 0).
  operationId: searchInventory
  requestBody:
    description: Search criteria with optional filters, pagination and sorting
    required: true
    content:
      application/json:
        schema:
          $ref: '../../components/inventory/components.yml#/components/schemas/SearchInventoryRequest'
        examples:
          fullFilters:
            summary: Search with multiple filters and sorting
            value:
              filters:
                productId: 42
                locationId: 5
                batchCode: "L20260301"
                categoryId: 3
                expiresWithinDays: 30
                stockStatus: "AVAILABLE"
              page: 0
              size: 20
              sort:
                - field: "quantity"
                  direction: "ASC"
          expiring:
            summary: Rows with a batch expiring within 15 days (includes already expired)
            value:
              filters:
                expiresWithinDays: 15
              page: 0
              size: 50
              sort:
                - field: "productName"
                  direction: "ASC"
          minimal:
            summary: Default search — all inventory, first page
            value: {}
  responses:
    '200':
      description: Paginated list of inventory rows matching the search criteria
      content:
        application/json:
          schema:
            $ref: '../../components/inventory/components.yml#/components/schemas/SearchInventoryResponse'
          examples:
            stockPage:
              summary: Page of inventory rows, one per product/location
              value:
                page: 0
                size: 20
                totalPages: 2
                totalItems: 24
                items:
                  - id: 1001
                    productId: 42
                    productName: "Leche Entera 1L"
                    productSku: "LECH-ENT-1L"
                    locationId: 5
                    locationName: "Tienda Centro Madrid"
                    quantity: 12
                    lastUpdated: "2026-05-17T10:15:00Z"
                  - id: 1002
                    productId: 43
                    productName: "Yogur Natural Pack 4"
                    productSku: "YOG-NAT-4"
                    locationId: 2
                    locationName: "Almacén Principal"
                    quantity: 0
                    lastUpdated: "2026-05-16T09:00:00Z"
            emptyResult:
              summary: No inventory rows match the filters
              value:
                page: 0
                size: 20
                totalPages: 0
                totalItems: 0
                items: []
    '400':
      description: >
        Invalid request — malformed filters, unsupported sort field, or a
        productId/locationId that does not exist for the current tenant
      content:
        application/json:
          schema:
            $ref: '../../components/errors/components.yml#/components/schemas/ApiErrorResponse'
          examples:
            productNotFound:
              summary: productId does not exist
              value:
                errorCode: INVENTORY_SEARCH_VALIDATION
                errorMessage: "Product with id 999 does not exist for current tenant"
            locationNotFound:
              summary: locationId does not exist
              value:
                errorCode: INVENTORY_SEARCH_VALIDATION
                errorMessage: "Location with id 999 does not exist for current tenant"
            invalidSortField:
              summary: Unsupported sort field
              value:
                errorCode: INVENTORY_SEARCH_VALIDATION
                errorMessage: "Invalid sort field 'name'. Allowed values: quantity, productName, locationName"
    '401':
      $ref: '../../components/errors/components.yml#/components/responses/Unauthorized'
    '403':
      $ref: '../../components/errors/components.yml#/components/responses/Forbidden'
    '500':
      $ref: '../../components/errors/components.yml#/components/responses/InternalServerError'
