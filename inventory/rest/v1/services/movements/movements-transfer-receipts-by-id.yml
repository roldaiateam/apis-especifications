get:
  tags:
    - Inventory
  summary: Get transfer receipt by ID
  description: >
    Retrieves the current processing state of a stock transfer receipt by its unique identifier.
    Useful for checking whether PENDING_RETRY items have been resolved after the initial POST.
    The tenant is automatically resolved from the JWT token (claim: tenant_name).
    Requires role: store_admin.
  operationId: getTransferReceipt
  parameters:
    - name: receiptId
      in: path
      required: true
      description: Unique identifier of the transfer receipt to retrieve.
      schema:
        $ref: '../../components/movements/components.yml#/components/schemas/ReceiptId'
  responses:
    '200':
      description: Transfer receipt retrieved successfully
      content:
        application/json:
          schema:
            $ref: '../../components/movements/components.yml#/components/schemas/TransferReceiptResponse'
          examples:
            completed:
              summary: All items processed successfully
              value:
                receiptId: 10
                status: COMPLETED
                totalItems: 1
                completedItems: 1
                failedItems: 0
                pendingRetryItems: 0
                results:
                  - index: 0
                    status: COMPLETED
                    movementId: 601
                    batchId: 311
            completedWithErrors:
              summary: One item failed permanently
              value:
                receiptId: 11
                status: COMPLETED_WITH_ERRORS
                totalItems: 1
                completedItems: 0
                failedItems: 1
                pendingRetryItems: 0
                results:
                  - index: 0
                    status: FAILED
                    batchId: 311
                    errorCode: INSUFFICIENT_STOCK
                    errorMessage: "Stock disponible insuficiente en la ubicación de origen"
    '401':
      $ref: '../../components/errors/components.yml#/components/responses/Unauthorized'
    '403':
      $ref: '../../components/errors/components.yml#/components/responses/Forbidden'
    '404':
      description: Receipt not found for the current tenant
      content:
        application/json:
          schema:
            $ref: '../../components/errors/components.yml#/components/schemas/ApiErrorResponse'
          examples:
            receiptNotFound:
              summary: Receipt does not exist
              value:
                errorCode: RECEIPT_NOT_FOUND
                errorMessage: "Transfer receipt with id 99 not found"
    '500':
      $ref: '../../components/errors/components.yml#/components/responses/InternalServerError'
