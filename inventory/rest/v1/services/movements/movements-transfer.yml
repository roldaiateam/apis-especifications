post:
  tags:
    - Inventory
  summary: Register stock transfers between locations
  description: >
    Registers one or more stock transfers from one location to another. Each item generates a
    single TRANSFER movement carrying both fromLocationId and toLocationId — never a pair of
    separate movements. batchId is optional: when omitted, the transfer is not tied to a
    specific batch.
    Each item is validated and persisted independently, in its own transaction (one TRANSFER
    event + two projection tasks, one per side) — a rejected item does not affect the others.
    There is no available-stock check: the source location is allowed to go negative.
    Registration is synchronous; the response reflects the final accepted/rejected outcome of
    every item, there is no receipt to poll and no async status.
    The tenant is automatically resolved from the JWT token (claim: tenant_name).
    Requires role: store_admin.
    Business rules per item:
    - productId, fromLocationId and toLocationId must exist; the product and both locations must be active.
    - batchId, when present, must exist and belong to productId.
    - fromLocationId and toLocationId must be different.
    - quantity must be > 0.
    - employee_id is extracted automatically from the JWT — do NOT include it in the request.
  operationId: registerTransferMovement
  requestBody:
    description: One or more stock transfers to register
    required: true
    content:
      application/json:
        schema:
          $ref: '../../components/movements/components.yml#/components/schemas/RegisterTransferBulkRequest'
        examples:
          singleTransfer:
            summary: Single item — transfer of one specific batch
            value:
              items:
                - productId: 42
                  batchId: 311
                  fromLocationId: 3
                  toLocationId: 5
                  quantity: 20
                  documentReference: "TRF-2026-0007"
                  movementDate: "2026-09-15T10:00:00Z"
          untrackedByBatch:
            summary: Single item — transfer not tied to a batch
            value:
              items:
                - productId: 42
                  fromLocationId: 3
                  toLocationId: 5
                  quantity: 20
  responses:
    '201':
      description: Items registered. Check accepted/errorCode per result for the outcome of each item.
      content:
        application/json:
          schema:
            $ref: '../../components/movements/components.yml#/components/schemas/MovementRegistrationResponse'
          examples:
            allAccepted:
              summary: Item registered successfully
              value:
                results:
                  - index: 0
                    accepted: true
                    movementId: 601
            partialFailure:
              summary: Item rejected — batch does not belong to the product
              value:
                results:
                  - index: 0
                    accepted: false
                    errorCode: BATCH_NOT_FOUND
                    errorMessage: "Batch 311 does not belong to product 42"
    '400':
      description: Request-level validation error — malformed payload or items array constraints violated
      content:
        application/json:
          schema:
            $ref: '../../components/errors/components.yml#/components/schemas/ApiErrorResponse'
          examples:
            emptyItems:
              summary: items array is empty or missing
              value:
                errorCode: MOVEMENT_TRANSFER_VALIDATION
                errorMessage: items array must contain between 1 and 100 elements
    '401':
      $ref: '../../components/errors/components.yml#/components/responses/Unauthorized'
    '403':
      $ref: '../../components/errors/components.yml#/components/responses/Forbidden'
    '500':
      $ref: '../../components/errors/components.yml#/components/responses/InternalServerError'
