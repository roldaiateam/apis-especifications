post:
  tags:
    - Inventory
  summary: Register outbound stock movements (FEFO)
  description: >
    Registers one or more outbound stock exits (sale, internal consumption, expiry, other).
    The batch is resolved automatically per item using a theoretical FEFO strategy (the active
    batch with the oldest expiryDate, nulls last) — it does not check available stock at the
    resolved batch or location, and the location is allowed to go negative; actual stock is
    corrected asynchronously by the projection and reconciliation.
    Each item is validated and persisted independently, in its own transaction (event +
    projection task) — a rejected item does not affect the others. Registration is synchronous;
    the response reflects the final accepted/rejected outcome of every item, there is no receipt
    to poll and no async status.
    The tenant is automatically resolved from the JWT token (claim: tenant_name).
    Requires role: store_admin.
    Business rules per item:
    - productId, locationId and reasonId must exist; product and location must be active.
    - quantity must be > 0.
    - the product must have at least one active batch to resolve via FEFO.
    - employee_id is extracted automatically from the JWT — do NOT include it in the request.
    Per-item error codes reported in results: PRODUCT_NOT_FOUND, PRODUCT_INACTIVE,
    LOCATION_NOT_FOUND, LOCATION_INACTIVE, MOVEMENT_REASON_NOT_FOUND.
  operationId: registerOutboundMovement
  requestBody:
    description: One or more outbound stock movements to register
    required: true
    content:
      application/json:
        schema:
          $ref: '../../components/movements/components.yml#/components/schemas/RegisterOutboundBulkRequest'
        examples:
          partialSuccess:
            summary: Two items — one succeeds, one fails
            value:
              items:
                - productId: 42
                  locationId: 5
                  quantity: 30
                  reasonId: 1
                  documentReference: "TCK-2026-00123"
                  movementDate: "2026-05-17T10:15:00Z"
                - productId: 43
                  locationId: 5
                  quantity: 12
                  reasonId: 2
                  documentReference: "TCK-2026-00123"
          minimal:
            summary: Single item — minimal required fields
            value:
              items:
                - productId: 10
                  locationId: 2
                  quantity: 5
                  reasonId: 1
  responses:
    '201':
      description: Items registered. Check accepted/errorCode per result for the outcome of each item.
      content:
        application/json:
          schema:
            $ref: '../../components/movements/components.yml#/components/schemas/MovementRegistrationResponse'
          examples:
            partialSuccess:
              summary: One item accepted, one rejected
              value:
                results:
                  - index: 0
                    accepted: true
                    movementId: 501
                  - index: 1
                    accepted: false
                    errorCode: PRODUCT_NOT_FOUND
                    errorMessage: "Product with id 43 not found"
            allAccepted:
              summary: All items registered successfully
              value:
                results:
                  - index: 0
                    accepted: true
                    movementId: 502
    '400':
      description: Request-level validation error — malformed payload or items array constraints violated
      content:
        application/json:
          schema:
            $ref: '../../components/errors/components.yml#/components/schemas/ApiErrorResponse'
          examples:
            emptyItems:
              summary: items array is empty or missing
              value:
                errorCode: MOVEMENT_OUTBOUND_VALIDATION
                errorMessage: items array must contain between 1 and 100 elements
    '401':
      $ref: '../../components/errors/components.yml#/components/responses/Unauthorized'
    '403':
      $ref: '../../components/errors/components.yml#/components/responses/Forbidden'
    '500':
      $ref: '../../components/errors/components.yml#/components/responses/InternalServerError'
