post:
  tags:
    - Inventory
  summary: Register inbound stock movements
  description: >
    Registers one or more inbound stock entries resulting from a supplier delivery.
    Each item is validated and persisted independently, in its own transaction (event +
    projection task) — a rejected item does not affect the others. Registration is synchronous;
    the response reflects the final accepted/rejected outcome of every item, there is no receipt
    to poll and no async status.
    The tenant is automatically resolved from the JWT token (claim: tenant_name).
    Requires role: store_admin.
    Business rules per item:
    - productId, supplierId and locationId must exist and be active.
    - batchCode is required when the product has trackedByBatch=true.
    - expiryDate is required when the product has trackedByExpiry=true and must be a future date.
    - manufacturingDate must be <= expiryDate when both are present.
    - quantity must be > 0 and unitCost must be > 0.
    - employee_id is extracted automatically from the JWT — do NOT include it in the request.
  operationId: registerInboundMovement
  requestBody:
    description: One or more inbound stock movements to register
    required: true
    content:
      application/json:
        schema:
          $ref: '../../components/movements/components.yml#/components/schemas/RegisterInboundBulkRequest'
        examples:
          partialSuccess:
            summary: Two items — one succeeds, one fails
            value:
              items:
                - productId: 42
                  supplierId: 7
                  locationId: 3
                  batchCode: "LOT-2026-001"
                  quantity: 100
                  expiryDate: "2027-01-15"
                  manufacturingDate: "2026-05-01"
                  unitCost: 2.50
                  unitCostCurrencyId: 1
                  documentReference: "FAC-2026-0042"
                  movementDate: "2026-07-06T10:00:00Z"
                - productId: 43
                  supplierId: 7
                  locationId: 3
                  batchCode: "LOT-2026-002"
                  quantity: 50
                  expiryDate: "2027-03-01"
                  unitCost: 1.80
                  unitCostCurrencyId: 1
                  documentReference: "FAC-2026-0042"
                  movementDate: "2026-07-06T10:00:00Z"
          minimal:
            summary: Single item — minimal required fields
            value:
              items:
                - productId: 10
                  supplierId: 3
                  locationId: 2
                  quantity: 30
                  unitCost: 1.20
                  unitCostCurrencyId: 1
  responses:
    '201':
      description: Items registered. Check accepted/errorCode per result for the outcome of each item.
      content:
        application/json:
          schema:
            $ref: '../../components/movements/components.yml#/components/schemas/MovementRegistrationResponse'
          examples:
            partialSuccess:
              summary: One item accepted, one rejected
              value:
                results:
                  - index: 0
                    accepted: true
                    movementId: 101
                  - index: 1
                    accepted: false
                    errorCode: PRODUCT_NOT_FOUND
                    errorMessage: "Product with id 43 not found"
            allAccepted:
              summary: All items registered successfully
              value:
                results:
                  - index: 0
                    accepted: true
                    movementId: 102
    '400':
      description: Request-level validation error — malformed payload or items array constraints violated
      content:
        application/json:
          schema:
            $ref: '../../components/errors/components.yml#/components/schemas/ApiErrorResponse'
          examples:
            emptyItems:
              summary: items array is empty or missing
              value:
                errorCode: MOVEMENT_INBOUND_VALIDATION
                errorMessage: items array must contain between 1 and 100 elements
    '401':
      $ref: '../../components/errors/components.yml#/components/responses/Unauthorized'
    '403':
      $ref: '../../components/errors/components.yml#/components/responses/Forbidden'
    '500':
      $ref: '../../components/errors/components.yml#/components/responses/InternalServerError'
