components:
  schemas:
    StockStatus:
      type: string
      description: >
        Stock availability status derived from the inventory quantity.
        - AVAILABLE: quantity greater than 0.
        - OUT_OF_STOCK: quantity equal to 0.
        MVP scope — LOW and BLOCKED statuses are deferred (they require reorder_point and a blocked flag).
      enum:
        - AVAILABLE
        - OUT_OF_STOCK
      example: "AVAILABLE"

    SearchInventoryRequest:
      type: object
      description: >
        Request payload to search and filter the inventory (stock) with pagination and sorting.
        Each result row represents the projected stock of one product in one location
        (Stock_Inventory) — the aggregate root. Batch-level detail is not returned here; it will
        be exposed by a separate, dedicated endpoint in the future.
        All filters are optional — an empty filters object returns all inventory rows.
        The tenant is automatically resolved from the JWT token (claim: tenant_name).
      properties:
        filters:
          $ref: '#/components/schemas/InventorySearchFilters'
        page:
          type: integer
          format: int32
          description: Zero-based page number. Defaults to 0.
          minimum: 0
          default: 0
          example: 0
        size:
          type: integer
          format: int32
          description: Number of items per page. Defaults to 20. Between 1 and 100.
          minimum: 1
          maximum: 100
          default: 20
          example: 20
        sort:
          type: array
          description: >
            Sort criteria applied in order of precedence.
            Defaults to quantity ASC when omitted (lowest stock first).
          items:
            $ref: '#/components/schemas/InventorySortCriteria'

    InventorySearchFilters:
      type: object
      description: >
        Filter criteria for inventory search. All fields are optional and combined with AND.
        batchCode and expiresWithinDays filter on the row's underlying batch detail even though
        that detail is not part of the response — a row matches if ANY of its batches satisfies
        the condition.
      properties:
        productId:
          type: integer
          format: int64
          description: Filter by product identifier. Must exist for the current tenant.
          example: 42
        locationId:
          type: integer
          format: int64
          description: Filter by storage location identifier. Must exist for the current tenant.
          example: 5
        batchCode:
          type: string
          description: >
            Exact match on the batch/lot code. A row matches if any of its batches has this code.
          example: "L20260301"
        categoryId:
          type: integer
          format: int64
          description: Filter by the product category.
          example: 3
        expiresWithinDays:
          type: integer
          format: int32
          description: >
            A row matches if any of its batches has an expiration date informed and less than or
            equal to today plus this number of days. Already-expired batches (expiration date
            before today) ARE included. Batches with no expiration date never match.
          minimum: 0
          example: 30
        stockStatus:
          $ref: '#/components/schemas/StockStatus'

    InventorySortCriteria:
      type: object
      description: Single sort criterion with field and direction.
      required:
        - field
        - direction
      properties:
        field:
          type: string
          description: Field to sort by.
          enum:
            - quantity
            - productName
            - locationName
          example: "quantity"
        direction:
          type: string
          description: Sort direction.
          enum:
            - ASC
            - DESC
          example: "ASC"

    SearchInventoryResponse:
      type: object
      description: Paginated response for inventory search.
      properties:
        page:
          type: integer
          format: int32
          description: Current zero-based page number.
          example: 0
        size:
          type: integer
          format: int32
          description: Requested page size.
          example: 20
        totalPages:
          type: integer
          format: int32
          description: Total number of pages available.
          example: 3
        totalItems:
          type: integer
          format: int64
          description: Total number of inventory rows matching the filters.
          example: 42
        items:
          type: array
          description: List of inventory rows for the current page.
          items:
            $ref: '#/components/schemas/InventoryStockItem'

    InventoryStockItem:
      type: object
      description: >
        A single inventory row returned by the search endpoint — the projected stock of one
        product in one location (Stock_Inventory, the aggregate root). Batch-level detail is not
        included; quantity is the aggregate total across all of the row's batches.
      properties:
        id:
          type: integer
          format: int64
          description: Unique identifier of the inventory row (Stock_Inventory id).
          example: 1001
        productId:
          type: integer
          format: int64
          description: Identifier of the product.
          example: 42
        productName:
          type: string
          description: Name of the product.
          example: "Leche Entera 1L"
        productSku:
          type: string
          description: SKU of the product.
          example: "LECH-ENT-1L"
        locationId:
          type: integer
          format: int64
          description: Identifier of the storage location.
          example: 5
        locationName:
          type: string
          description: Name of the location where the stock is held.
          example: "Almacén Principal"
        quantity:
          type: integer
          format: int32
          description: Total quantity of the product available in the location, across all batches.
          example: 12
        lastUpdated:
          type: string
          format: date-time
          description: Timestamp of the last update to this inventory row (ISO 8601).
          example: "2026-05-17T10:15:00Z"
