components:
  schemas:
    RegisterInboundBulkRequest:
      type: object
      description: >
        Request payload to register one or more inbound stock movements in a single operation.
        documentReference and notes apply to the entire delivery receipt and are shared across all items.
        Each item in the items array is processed independently — partial failures are reported
        per item in the response without rolling back successfully processed items.
      required:
        - items
      properties:
        documentReference:
          type: string
          description: Reference to the source document (delivery note, invoice number, etc.). Applies to all items.
          minLength: 1
          maxLength: 100
          example: "FAC-2026-0042"
        notes:
          type: string
          description: General notes about the delivery. Applies to all items.
          minLength: 1
          maxLength: 1000
          example: "Entrega proveedor Lacteos SA — 15 julio"
        items:
          type: array
          description: List of inbound stock movements to register. Between 1 and 100 items per request.
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/RegisterInboundItemInput'

    RegisterInboundItemInput:
      type: object
      description: >
        Individual inbound stock movement within a bulk request.
        Atomically creates or increments a ProductBatch (by natural key product_id + batch_code)
        and updates the Inventory row (batch_id + location_id).
        Business rules:
        - productId, supplierId and locationId must exist and be active.
        - batchCode is required when the product has trackedByBatch=true; auto-generated otherwise.
        - expiryDate is required when the product has trackedByExpiry=true and must be a future date.
        - manufacturingDate must be <= expiryDate when both are present.
        - quantity must be > 0 and unitCost must be > 0.
        - employee_id is resolved automatically from the JWT token — do NOT include it in the request.
      required:
        - productId
        - supplierId
        - locationId
        - quantity
        - unitCost
        - unitCostCurrencyId
      properties:
        productId:
          type: integer
          format: int64
          description: Identifier of the product being received. Must exist and be active.
          example: 42
        supplierId:
          type: integer
          format: int64
          description: Identifier of the supplier providing the goods. Must exist.
          example: 7
        locationId:
          type: integer
          format: int64
          description: Identifier of the destination storage location. Must exist and be active. Maps to to_location_id in inventory_movement.
          example: 3
        batchCode:
          type: string
          description: >
            Batch/lot code for the product. Required when the product has trackedByBatch=true.
            If the product does not track by batch, a DEFAULT batch is used automatically.
          minLength: 1
          maxLength: 100
          example: "LOT-2026-001"
        quantity:
          type: integer
          format: int32
          description: Number of units being received. Must be greater than 0.
          minimum: 1
          example: 100
        expiryDate:
          type: string
          format: date
          description: >
            Expiry date of the batch (ISO 8601 date). Required when the product has trackedByExpiry=true.
            Must be a future date.
          example: "2027-01-15"
        manufacturingDate:
          type: string
          format: date
          description: >
            Manufacturing date of the batch (ISO 8601 date). Optional.
            When both manufacturingDate and expiryDate are present, manufacturingDate must be <= expiryDate.
          example: "2026-05-01"
        unitCost:
          type: number
          format: double
          description: Unit purchase cost of the goods. Must be > 0. Stored in product_batch.unit_cost to feed cost history.
          minimum: 0.01
          example: 2.50
        unitCostCurrencyId:
          type: integer
          format: int64
          description: Identifier of the currency for unitCost. Foreign key to supported_currency table.
          example: 1
        movementDate:
          type: string
          format: date-time
          description: Date and time of the movement (ISO 8601). Defaults to current server time when omitted.
          example: "2026-07-06T10:00:00Z"

    InboundReceiptResponse:
      type: object
      description: >
        Response for an inbound bulk registration operation. Returned immediately on POST (201)
        and on subsequent GET by receiptId. Reflects the current processing state of each item.
      properties:
        receiptId:
          $ref: '#/components/schemas/ReceiptId'
        status:
          $ref: '#/components/schemas/ReceiptStatus'
        totalItems:
          type: integer
          format: int32
          description: Total number of items submitted in the original request.
          example: 2
        completedItems:
          type: integer
          format: int32
          description: Number of items successfully processed.
          example: 1
        failedItems:
          type: integer
          format: int32
          description: Number of items that failed permanently.
          example: 1
        pendingRetryItems:
          type: integer
          format: int32
          description: Number of items pending retry due to transient errors.
          example: 0
        results:
          type: array
          description: Per-item processing result, preserving the original submission order via index.
          items:
            $ref: '#/components/schemas/InboundReceiptItemResult'

    InboundReceiptItemResult:
      type: object
      description: Processing result for a single item within an inbound bulk receipt.
      required:
        - index
        - status
        - productId
      properties:
        index:
          type: integer
          format: int32
          description: Zero-based position of the item in the original items array.
          example: 0
        status:
          $ref: '#/components/schemas/ReceiptItemStatus'
        movementId:
          type: integer
          format: int64
          description: Identifier of the created inventory movement record. Present only when status is COMPLETED.
          example: 101
        productId:
          type: integer
          format: int64
          description: Identifier of the product from the original item, for traceability.
          example: 42
        errorCode:
          type: string
          description: Machine-readable error code. Present only when status is FAILED or PENDING_RETRY.
          example: "PRODUCT_NOT_FOUND"
        errorMessage:
          type: string
          description: Human-readable error description. Present only when status is FAILED or PENDING_RETRY.
          example: "Product with id 43 not found"

    RegisterOutboundBulkRequest:
      type: object
      description: >
        Request payload to register one or more outbound stock movements in a single operation.
        documentReference and notes apply to the entire receipt and are shared across all items.
        Each item in the items array is processed independently — partial failures are reported
        per item in the response without rolling back successfully processed items.
      required:
        - items
      properties:
        documentReference:
          type: string
          description: Reference to the source document (sales ticket, consumption note, etc.). Applies to all items.
          minLength: 1
          maxLength: 100
          example: "TCK-2026-00123"
        notes:
          type: string
          description: General notes about the outbound operation. Applies to all items.
          minLength: 1
          maxLength: 1000
          example: "Cierre de caja turno mañana"
        items:
          type: array
          description: List of outbound stock movements to register. Between 1 and 100 items per request.
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/RegisterOutboundItemInput'

    RegisterOutboundItemInput:
      type: object
      description: >
        Individual outbound stock movement within a bulk request.
        The requested quantity is consumed from the product's active batches at the given location
        following the FEFO strategy (expiryDate ASC, batches without expiry last, then createdAt ASC).
        A single item may consume several batches, generating one OUT movement per affected batch.
        Business rules:
        - productId, locationId and reasonId must exist; product and location must be active.
        - quantity must be > 0.
        - If the total available stock does not cover quantity, the item fails with INSUFFICIENT_STOCK.
        - employee_id is resolved automatically from the JWT token — do NOT include it in the request.
      required:
        - productId
        - locationId
        - quantity
        - reasonId
      properties:
        productId:
          type: integer
          format: int64
          description: Identifier of the product being withdrawn. Must exist and be active.
          example: 42
        locationId:
          type: integer
          format: int64
          description: Identifier of the source storage location. Must exist and be active. Maps to from_location_id in inventory_movement.
          example: 5
        quantity:
          type: integer
          format: int32
          description: Number of units to withdraw. Must be greater than 0.
          minimum: 1
          example: 30
        reasonId:
          type: integer
          format: int64
          description: Identifier of the movement reason (SALE, INTERNAL_CONSUMPTION, EXPIRY, OTHER). Foreign key to movement_reason.
          example: 1
        movementDate:
          type: string
          format: date-time
          description: Date and time of the movement (ISO 8601). Defaults to current server time when omitted.
          example: "2026-05-17T10:15:00Z"

    OutboundReceiptResponse:
      type: object
      description: >
        Response for an outbound bulk registration operation. Returned immediately on POST (201)
        and on subsequent GET by receiptId. Reflects the current processing state of each item.
      properties:
        receiptId:
          $ref: '#/components/schemas/ReceiptId'
        status:
          $ref: '#/components/schemas/ReceiptStatus'
        totalItems:
          type: integer
          format: int32
          description: Total number of items submitted in the original request.
          example: 2
        completedItems:
          type: integer
          format: int32
          description: Number of items successfully processed.
          example: 1
        failedItems:
          type: integer
          format: int32
          description: Number of items that failed permanently.
          example: 1
        pendingRetryItems:
          type: integer
          format: int32
          description: Number of items pending retry due to transient errors.
          example: 0
        results:
          type: array
          description: Per-item processing result, preserving the original submission order via index.
          items:
            $ref: '#/components/schemas/OutboundReceiptItemResult'

    OutboundReceiptItemResult:
      type: object
      description: >
        Processing result for a single item within an outbound bulk receipt.
        When the item consumes several batches (FEFO), movementId reflects the representative
        movement; the full set of generated movements is available via the movements search endpoint.
      required:
        - index
        - status
        - productId
      properties:
        index:
          type: integer
          format: int32
          description: Zero-based position of the item in the original items array.
          example: 0
        status:
          $ref: '#/components/schemas/ReceiptItemStatus'
        movementId:
          type: integer
          format: int64
          description: Identifier of the representative OUT movement. Present only when status is COMPLETED.
          example: 501
        productId:
          type: integer
          format: int64
          description: Identifier of the product from the original item, for traceability.
          example: 42
        errorCode:
          type: string
          description: Machine-readable error code. Present only when status is FAILED or PENDING_RETRY.
          example: "INSUFFICIENT_STOCK"
        errorMessage:
          type: string
          description: Human-readable error description. Present only when status is FAILED or PENDING_RETRY.
          example: "Stock disponible insuficiente"

    ReceiptStatus:
      type: string
      description: >
        Overall processing status of an inbound receipt.
        - PROCESSING: receipt accepted, items still being processed (used for async scenarios).
        - COMPLETED: all items processed successfully.
        - COMPLETED_WITH_ERRORS: at least one item failed or is pending retry.
        - FAILED: all items failed permanently.
      enum:
        - PROCESSING
        - COMPLETED
        - COMPLETED_WITH_ERRORS
        - FAILED
      example: "COMPLETED_WITH_ERRORS"

    ReceiptItemStatus:
      type: string
      description: >
        Processing status of a single item within an inbound receipt.
        - COMPLETED: item processed successfully, movementId is present.
        - FAILED: item failed permanently, errorCode and errorMessage are present.
        - PENDING_RETRY: item failed transiently and is scheduled for retry.
      enum:
        - COMPLETED
        - FAILED
        - PENDING_RETRY
        - PENDING
      example: "COMPLETED"

    ReceiptId:
      type: integer
      format: int64
      description: Unique identifier for an inbound stock receipt.
      example: 1

    MovementType:
      type: string
      description: >
        Type of inventory movements.
        - IN: inbound stock entry (purchase from supplier).
        - OUT: outbound stock exit (sale or consumption).
        - ADJUSTMENT: manual stock correction.
        - TRANSFER: stock moved between locations.
        - COMPENSATION: compensatory adjustment.
      enum:
        - IN
        - OUT
        - ADJUSTMENT
        - TRANSFER
        - COMPENSATION
      example: "IN"

    SearchMovementsRequest:
      type: object
      description: >
        Request payload to search and filter inventory movements with pagination and sorting.
        All filters are optional — an empty filters object returns all movements.
        The tenant is automatically resolved from the JWT token (claim: tenant_name).
      properties:
        filters:
          $ref: '#/components/schemas/MovementSearchFilters'
        page:
          type: integer
          format: int32
          description: Zero-based page number. Defaults to 0.
          minimum: 0
          default: 0
          example: 0
        size:
          type: integer
          format: int32
          description: Number of items per page. Defaults to 20. Maximum 100.
          minimum: 1
          maximum: 100
          default: 20
          example: 20
        sort:
          type: array
          description: >
            Sort criteria applied in order of precedence.
            Defaults to movementDate DESC when omitted.
          items:
            $ref: '#/components/schemas/MovementSortCriteria'

    MovementSearchFilters:
      type: object
      description: >
        Filter criteria for movement search. All fields are optional.
        locationId is a convenience filter that matches either fromLocationId or toLocationId —
        it cannot be combined with fromLocationId or toLocationId in the same request.
      properties:
        productId:
          type: integer
          format: int64
          description: Filter by product identifier.
          example: 42
        locationId:
          type: integer
          format: int64
          description: >
            Convenience filter — matches movements where the location appears as origin OR destination.
            Mutually exclusive with fromLocationId and toLocationId.
          example: 5
        fromLocationId:
          type: integer
          format: int64
          description: Filter by origin location. Mutually exclusive with locationId.
          example: 3
        toLocationId:
          type: integer
          format: int64
          description: Filter by destination location. Mutually exclusive with locationId.
          example: 5
        batchCode:
          type: string
          description: Exact match on batch/lot code.
          example: "L20260301"
        movementTypeId:
          type: integer
          format: int64
          description: Filter by movement type identifier (IN, OUT, ADJUSTMENT, TRANSFER, COMPENSATION).
          example: 2
        reasonId:
          type: integer
          format: int64
          description: Filter by movement reason identifier.
          example: 1
        userId:
          type: string
          format: uuid
          description: Filter by the operator who created the movement.
          example: "user-uuid-123"
        dateFrom:
          type: string
          format: date-time
          description: Inclusive start of the date range filter on movementDate (ISO 8601).
          example: "2026-05-01T00:00:00Z"
        dateTo:
          type: string
          format: date-time
          description: Inclusive end of the date range filter on movementDate (ISO 8601). Must be >= dateFrom.
          example: "2026-05-17T23:59:59Z"
        includeCompensated:
          type: boolean
          description: >
            Whether to include movements that have already been compensated.
            Defaults to true. Set to false to hide compensated movements.
          default: true
          example: true
        onlyCompensations:
          type: boolean
          description: >
            When true, returns only movements of type COMPENSATION.
            Defaults to false.
          default: false
          example: false
        transferGroupId:
          type: string
          format: uuid
          description: Filter by transfer group identifier to retrieve the pair of movements that form a transfer.
          example: "8f3e9c1b-7a52-4d8e-b1f4-9c2a6e5d8b3a"
        documentReference:
          type: string
          description: Exact match on document reference (delivery note, invoice number, etc.).
          example: "ALB-2026-00045"

    MovementSortCriteria:
      type: object
      description: Single sort criterion with field and direction.
      required:
        - field
        - direction
      properties:
        field:
          type: string
          description: Field to sort by.
          enum:
            - movementDate
            - quantity
          example: "movementDate"
        direction:
          type: string
          description: Sort direction.
          enum:
            - ASC
            - DESC
          example: "DESC"

    SearchMovementsResponse:
      type: object
      description: Paginated response for movement search.
      properties:
        page:
          type: integer
          format: int32
          description: Current zero-based page number.
          example: 0
        size:
          type: integer
          format: int32
          description: Requested page size.
          example: 20
        totalPages:
          type: integer
          format: int32
          description: Total number of pages available.
          example: 5
        totalItems:
          type: integer
          format: int64
          description: Total number of movements matching the filters.
          example: 92
        items:
          type: array
          description: List of movements for the current page.
          items:
            $ref: '#/components/schemas/InventoryMovementSummary'

    InventoryMovementSummary:
      type: object
      description: Summary of a single inventory movement returned by the search endpoint.
      properties:
        movementId:
          type: integer
          format: int64
          description: Unique identifier of the movement.
          example: 5010
        type:
          $ref: '#/components/schemas/MovementType'
        movementDate:
          type: string
          format: date-time
          description: Date and time when the movement occurred (ISO 8601).
          example: "2026-05-17T10:15:00Z"
        createdBy:
          $ref: '#/components/schemas/MovementUserSummary'
        product:
          $ref: '#/components/schemas/MovementProductSummary'
        batch:
          nullable: true
          description: Batch information. Null when the movement is not batch-tracked.
          allOf:
            - $ref: '#/components/schemas/MovementBatchSummary'
        fromLocation:
          nullable: true
          description: Origin location. Null for inbound movements (IN).
          allOf:
            - $ref: '#/components/schemas/MovementLocationSummary'
        toLocation:
          nullable: true
          description: Destination location. Null for outbound movements (OUT).
          allOf:
            - $ref: '#/components/schemas/MovementLocationSummary'
        quantity:
          type: integer
          format: int32
          description: >
            Quantity moved. Positive for inbound (IN), negative for outbound (OUT).
            Sign convention depends on the movement type.
          example: -25
        reason:
          $ref: '#/components/schemas/MovementReasonSummary'
        documentReference:
          type: string
          nullable: true
          description: Reference to the source document (delivery note, invoice, etc.).
          example: null
        transferGroupId:
          type: string
          format: uuid
          nullable: true
          description: Identifier linking the pair of movements that form a transfer.
          example: null
        compensatedByMovementId:
          type: integer
          format: int64
          nullable: true
          description: Identifier of the compensation movement that reversed this movement. Null if not compensated.
          example: null
        compensatesMovementId:
          type: integer
          format: int64
          nullable: true
          description: Identifier of the original movement that this compensation reverses. Null if this is not a compensation.
          example: null
        notes:
          type: string
          nullable: true
          description: Free-text notes about the movement.
          maxLength: 1000
          example: "Venta mostrador ticket #4521"

    MovementUserSummary:
      type: object
      description: Summary of the user who created a movement.
      properties:
        id:
          type: string
          format: uuid
          description: User identifier.
          example: "user-uuid-123"
        name:
          type: string
          description: Display name of the user.
          example: "Andrea Pérez"

    MovementProductSummary:
      type: object
      description: Summary of the product involved in a movement.
      properties:
        id:
          type: integer
          format: int64
          description: Product identifier.
          example: 42
        name:
          type: string
          description: Product name.
          example: "Leche Entera 1L"
        sku:
          type: string
          description: Stock keeping unit code.
          example: "LECH-ENT-1L"

    MovementBatchSummary:
      type: object
      description: Summary of the batch involved in a movement.
      properties:
        id:
          type: integer
          format: int64
          description: Batch identifier.
          example: 311
        code:
          type: string
          description: Batch/lot code.
          example: "L20260301"
        expiryDate:
          type: string
          format: date
          nullable: true
          description: Expiry date of the batch (ISO 8601 date). Null when the product does not track expiry.
          example: "2026-06-15"

    MovementLocationSummary:
      type: object
      description: Summary of a storage location involved in a movement.
      properties:
        id:
          type: integer
          format: int64
          description: Location identifier.
          example: 5
        name:
          type: string
          description: Location name.
          example: "Tienda Centro Madrid"

    MovementReasonSummary:
      type: object
      description: Summary of the reason for a movement.
      properties:
        id:
          type: integer
          format: int64
          description: Reason identifier.
          example: 1
        code:
          type: string
          description: Machine-readable reason code.
          example: "SALE"
        name:
          type: string
          description: Human-readable reason name.
          example: "Venta"
