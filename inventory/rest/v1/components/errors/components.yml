components:
  schemas:
    ApiErrorResponse:
      type: object
      additionalProperties: false
      properties:
        errorCode:
          type: string
          description: Error code
          example: "VALIDATION_ERROR"
        errorMessage:
          type: string
          description: Error message
          example: "An error occurred"
          maxLength: 255
        details:
          type: object
          nullable: true
          additionalProperties: true
          description: >
            Optional structured metadata providing additional context about the error.
            Present only when the error carries extra information (e.g. a list of missing entity IDs).

  responses:
    BadRequest:
      description: Request contains incorrect syntax, invalid fields, or violated logical validation rules
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          examples:
            validationError:
              summary: Validation rule violation
              value:
                errorCode: VALIDATION_ERROR
                errorMessage: Invalid request parameters
    Unauthorized:
      description: JWT is missing or invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          examples:
            unauthorized:
              value:
                errorCode: UNAUTHORIZED
                errorMessage: Missing or invalid token
    Forbidden:
      description: User role is insufficient to execute this endpoint
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          examples:
            forbidden:
              value:
                errorCode: FORBIDDEN
                errorMessage: Insufficient role to execute operation
    NotFound:
      description: Referenced entity was not found for the current tenant
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          examples:
            notFound:
              value:
                errorCode: MOVEMENT_TYPE_NOT_FOUND
                errorMessage: Movement type does not exist for current tenant
    Conflict:
      description: Uniqueness or state conflict for tenant
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          examples:
            conflict:
              value:
                errorCode: MOVEMENT_TYPE_ALREADY_EXISTS
                errorMessage: Movement type already exists for tenant
    InternalServerError:
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    ServiceUnavailable:
      description: Service Unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    GatewayTimeout:
      description: Gateway Timeout - Use it to report a Timeout occurred on the server.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    Default:
      description: Unexpected error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
