[build]
  # Directory to publish (relative to repository root)
  publish = "docs"

  # Build command (we generate docs via GitHub Actions, not Netlify build)
  command = "echo 'Documentation generated by GitHub Actions'"

# Netlify Functions configuration
[functions]
  directory = "netlify/functions"

# Production context: main branch
[context.production]
  publish = "docs"

# Deploy Preview context: all other branches
[context.deploy-preview]
  publish = "docs"

# Branch context: develop branch
[context.develop]
  publish = "docs"

# Redirect rules (optional, for future use)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 404
