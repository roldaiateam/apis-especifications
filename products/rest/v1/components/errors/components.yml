components:
  schemas:
    ApiErrorResponse:
      type: object
      additionalProperties: false
      properties:
        errorCode:
          type: string
          description: Error code
          example: "VALIDATION_ERROR"
        errorMessage:
          type: string
          description: Error message
          example: "An error occurred"
          maxLength: 255

  responses:
    BadRequest:
      description: Request contains incorrect syntax, invalid fields, or violated logical validation rules
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          examples:
            validationError:
              summary: Validation rule violation
              value:
                errorCode: VALIDATION_ERROR
                errorMessage: trackedBySerial and trackedByBatch cannot both be true
    Unauthorized:
      description: JWT is missing or invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          examples:
            unauthorized:
              value:
                errorCode: UNAUTHORIZED
                errorMessage: Missing or invalid token
    Forbidden:
      description: User role is insufficient to execute this endpoint
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          examples:
            forbidden:
              value:
                errorCode: FORBIDDEN
                errorMessage: Insufficient role to execute operation
    NotFound:
      description: Referenced entity was not found for the current tenant or catalog
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          examples:
            categoryNotFound:
              value:
                errorCode: CATEGORY_NOT_FOUND
                errorMessage: Category does not exist for current tenant
            unitOfMeasureNotFound:
              value:
                errorCode: UNIT_OF_MEASURE_NOT_FOUND
                errorMessage: Unit of measure does not exist
    Conflict:
      description: Product uniqueness conflict for tenant
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          examples:
            skuAlreadyExists:
              value:
                errorCode: PRODUCT_SKU_ALREADY_EXISTS
                errorMessage: Product SKU already exists for tenant
            barcodeAlreadyExists:
              value:
                errorCode: BARCODE_ALREADY_EXISTS
                errorMessage: Barcode already exists for tenant
    InternalServerError:
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    ServiceUnavailable:
      description: Service Unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    GatewayTimeout:
      description: Gateway Timeout - Use it to report a Timeout occurred on the server.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    Default:
      description: Unexpected error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
