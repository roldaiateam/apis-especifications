components:
  schemas:
    CreateProductRequest:
      type: object
      description: >
        Request payload for creating a new product. The tenant is automatically resolved from the JWT token.
        Business rules:
        - `trackedByBatch` and `trackedBySerial` are mutually exclusive (cannot both be true).
        - `trackedByExpiry: true` requires `trackedByBatch: true`.
        - If `barcodes` is provided, exactly one item must have `isDefault: true`.
        - Each barcode value must be unique per tenant.
        - `imageUrl` and `imageKey` are optional and mutually exclusive. Sending both → 400.
        - `imageKey` must reference an existing row in product_image (previously uploaded). Inexistent key → 404.
      required:
        - name
        - sku
        - unitOfMeasureId
        - trackedByBatch
        - trackedBySerial
        - trackedByExpiry
      properties:
        name:
          type: string
          description: Name of the product. Does not need to be unique per tenant.
          minLength: 1
          maxLength: 255
          example: "Leche Entera 1L"
        sku:
          type: string
          description: Stock Keeping Unit identifier. Must be unique per tenant. Allowed characters are uppercase letters, digits, and hyphens.
          minLength: 1
          maxLength: 100
          pattern: "^[A-Z0-9][A-Z0-9\\-]*$"
          example: "LECH-ENT-1L"
        categoryId:
          type: integer
          format: int64
          description: Identifier of the category for this product. Optional; if provided it must exist for the current tenant.
          example: 10
        unitOfMeasureId:
          $ref: '../units/components.yml#/components/schemas/UnitOfMeasureId'
        trackedByBatch:
          type: boolean
          description: Indicates whether the product is tracked by batch. Mutually exclusive with trackedBySerial.
          example: true
        trackedBySerial:
          type: boolean
          description: Indicates whether the product is tracked by serial number. Mutually exclusive with trackedByBatch.
          example: false
        trackedByExpiry:
          type: boolean
          description: Indicates whether the product is tracked by expiry date. Requires trackedByBatch to be true when set to true.
          example: true
        description:
          type: string
          description: Optional free-text description of the product.
          maxLength: 500
          example: "Leche entera pasteurizada de 1 litro"
        additionalInformation:
          type: string
          description: Optional free-text field for any additional information about the product.
          maxLength: 500
          example: "Conservación entre 1°C y 4°C. No congelar."
        imageUrl:
          type: string
          format: uri
          description: >
            URL of an external image (e.g. from a supplier CDN). Optional.
            Mutually exclusive with imageKey — sending both returns 400.
            A new row is inserted in product_image with source EXTERNAL.
          example: "https://cdn.proveedor.com/leche-entera.jpg"
        imageKey:
          type: string
          description: >
            Key of a previously uploaded image (returned by POST /v1/products/images/upload). Optional.
            Mutually exclusive with imageUrl — sending both returns 400.
            References an existing row in product_image with source INTERNAL.
          example: "tenant_uuid/products/abc123.jpg"
        barcodes:
          type: array
          description: >
            Optional list of barcodes to associate with the product at creation time.
            If provided, exactly one item must have isDefault set to true.
            Each barcode value must be unique per tenant.
          items:
            $ref: '#/components/schemas/CreateProductBarcodeInput'

    CreateProductBarcodeInput:
      type: object
      description: Barcode to be associated with a product at creation time.
      required:
        - barcode
        - barcodeTypeId
        - isDefault
      properties:
        barcode:
          type: string
          description: Barcode value. Must be unique per tenant.
          minLength: 1
          maxLength: 50
          example: "8412345678901"
        barcodeTypeId:
          $ref: '../barcode/components.yml#/components/schemas/BarcodeTypeId'
        isDefault:
          type: boolean
          description: Indicates whether this is the default barcode for the product. Exactly one barcode in the list must be true.
          example: true

    CreateProductResponse:
      type: object
      properties:
        productId:
          type: integer
          format: int64
          description: Unique identifier for the created product.
          example: 42
