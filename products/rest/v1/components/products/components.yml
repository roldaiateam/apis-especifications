components:
  schemas:
    CreateProductRequest:
      type: object
      description: >
        Request payload for creating a new product. The tenant is automatically resolved from the JWT token.
        Business rules:
        - `trackedByBatch` and `trackedBySerial` are mutually exclusive (cannot both be true).
        - `trackedByExpiry: true` requires `trackedByBatch: true`.
        - If `barcodes` is provided, exactly one item must have `isDefault: true`.
        - Each barcode value must be unique per tenant.
        - If `images` is provided, exactly one item must have `isMain: true`.
        - Each image item must provide at least one of `id` or `url`.
      required:
        - name
        - sku
        - unitOfMeasureId
        - trackedByBatch
        - trackedBySerial
        - trackedByExpiry
        - sellPrice
        - sellPriceCurrencyId
      properties:
        keyword:
          type: string
          description: >
            Free-text search term. Performs a case-insensitive partial match (ILIKE)
            across product name, SKU, and brand fields.
          maxLength: 255
          example: "Leche"
        categoryId:
          type: integer
          format: int64
          description: Identifier of the category for this product. Optional; if provided it must exist for the current tenant.
          example: 10
        unitOfMeasureId:
          type: integer
          format: int64
          description: Identifier of the unit of measure from products units of measure catalog.
          example: 1
        trackedByBatch:
          type: boolean
          description: Indicates whether the product is tracked by batch. Mutually exclusive with trackedBySerial.
          example: true
        trackedBySerial:
          type: boolean
          description: Indicates whether the product is tracked by serial number. Mutually exclusive with trackedByBatch.
          example: false
        trackedByExpiry:
          type: boolean
          description: Indicates whether the product is tracked by expiry date. Requires trackedByBatch to be true when set to true.
          example: true
        description:
          type: string
          description: Optional free-text description of the product.
          maxLength: 500
          example: "Leche entera pasteurizada de 1 litro"
        additionalInformation:
          type: string
          description: Optional free-text field for any additional information about the product.
          maxLength: 500
          example: "Conservación entre 1°C y 4°C. No congelar."
        parentId:
          type: integer
          format: int64
          description: >
            Identifier of the parent product. Optional; used for product variants.
            If provided, the referenced product must exist for the current tenant.
          example: 5
        images:
          type: array
          description: >
            Optional list of images to associate with the product.
            Each item must provide either id (reference to an existing uploaded image)
            or url (external URL) — not both.
            If provided, exactly one item must have isMain set to true.
          items:
            $ref: '#/components/schemas/CreateProductImageInput'
        barcodes:
          type: array
          description: >
            Optional list of barcodes to associate with the product at creation time.
            If provided, exactly one item must have isDefault set to true.
            Each barcode value must be unique per tenant.
          items:
            $ref: '#/components/schemas/CreateProductBarcodeInput'
        sellPrice:
          type: number
          format: double
          description: >
            Current sell price of the product. Must be greater than 0.
            This value is recorded in the product sell price history with source CREATE.
          minimum: 0.01
          example: 1.99
        sellPriceCurrencyId:
          type: integer
          format: int32
          description: ID of the supported currency from the supported currencies catalog (GET /v1/products/supported-currencies).
          example: 2

    CreateProductImageInput:
      type: object
      description: >
        Image to associate with a product at creation time.
        At least one of id or url must be provided.
      required:
        - isMain
        - sortOrder
      properties:
        id:
          type: integer
          format: int64
          description: >
            ID of an existing image in the images catalog (previously uploaded via upload endpoint). Optional.
          example: 7
        url:
          type: string
          format: uri
          description: >
            External image URL. Optional. If provided without id,
            a new row is inserted in images with source EXTERNAL.
          example: "https://cdn.proveedor.com/leche-entera.jpg"
        isMain:
          type: boolean
          description: Whether this is the primary image for the product.
          example: true
        sortOrder:
          type: integer
          description: Display order of the image (0 = first).
          example: 0

    CreateProductBarcodeInput:
      type: object
      description: Barcode to be associated with a product at creation time.
      required:
        - barcode
        - barcodeTypeId
        - isDefault
      properties:
        barcode:
          type: string
          description: Barcode value. Must be unique per tenant.
          minLength: 1
          maxLength: 50
          example: "8412345678901"
        barcodeTypeId:
          $ref: '../barcode/components.yml#/components/schemas/BarcodeTypeId'
        isDefault:
          type: boolean
          description: Indicates whether this is the default barcode for the product. Exactly one barcode in the list must be true.
          example: true

    CreateProductResponse:
      type: object
      properties:
        productId:
          type: integer
          format: int64
          description: Unique identifier for the created product.
          example: 42

    # ──────────────────────────────────────────────
    # Search Products schemas
    # ──────────────────────────────────────────────

    SearchProductsRequest:
      type: object
      description: >
        Search criteria and pagination parameters for querying products.
        All filter fields are optional. When omitted, no filter is applied for that field.
        Results are paginated using page/size.
      properties:
        filters:
          $ref: '#/components/schemas/ProductSearchFilters'
        page:
          type: integer
          format: int32
          description: Zero-based page index. The first page is 0.
          minimum: 0
          default: 0
          example: 0
        size:
          type: integer
          format: int32
          description: Number of items per page. Must be between 1 and 100.
          minimum: 1
          maximum: 100
          default: 20
          example: 20
        sort:
          type: array
          description: List of sort criteria to apply in order. Each item specifies a field and direction.
          items:
            $ref: '#/components/schemas/SortCriteria'
          example:
            - field: "name"
              direction: "ASC"

    SortCriteria:
      type: object
      description: A single sort criterion specifying a field and direction.
      required:
        - field
        - direction
      properties:
        field:
          type: string
          description: Field name to sort by.
          enum:
            - name
            - sku
            - brand
            - sellPrice
            - createdAt
            - updatedAt
          example: "name"
        direction:
          type: string
          description: Sort direction.
          enum:
            - ASC
            - DESC
          example: "ASC"

    ProductSearchFilters:
      type: object
      description: >
        Optional filter criteria for searching products.
        All fields are optional — omit a field to skip that filter.
      properties:
        name:
          type: string
          description: Partial match on product name (case-insensitive).
          maxLength: 255
          example: "Leche"
        sku:
          type: string
          description: Partial match on product SKU (case-insensitive).
          maxLength: 100
          example: "LECH"
        brand:
          type: string
          description: Partial match on product brand (case-insensitive).
          maxLength: 100
          example: "Pascual"
        categoryIds:
          type: array
          description: Filter by one or more category IDs. Matches products that belong to any of the specified categories.
          items:
            type: integer
            format: int64
            description: Filter by category identifier.
            example: 10
          example: [10, 15]
        active:
          type: boolean
          description: Filter by active status.
          example: true
        unitOfMeasureId:
          type: integer
          format: int64
          description: Filter by unit of measure identifier.
          example: 1

    SearchProductsResponse:
      type: object
      description: Paginated search results for products.
      properties:
        page:
          type: integer
          format: int32
          description: Current page index (zero-based).
          example: 1
        size:
          type: integer
          format: int32
          description: Number of items per page.
          example: 3
        totalPages:
          type: integer
          format: int32
          description: Total number of pages available.
          example: 5
        totalItems:
          type: integer
          format: int64
          description: Total number of items matching the search criteria.
          example: 15
        items:
          type: array
          description: List of products matching the search criteria for the current page.
          items:
            $ref: '#/components/schemas/ProductSummary'

    ProductSummary:
      type: object
      description: Lightweight representation of a product for search result listings.
      properties:
        id:
          type: integer
          format: int64
          description: Unique identifier of the product.
          example: 42
        sku:
          type: string
          description: Stock Keeping Unit identifier.
          maxLength: 100
          example: "LECH-ENT-1L"
        name:
          type: string
          description: Name of the product.
          maxLength: 255
          example: "Leche Entera 1L"
        brand:
          type: string
          description: Brand of the product.
          maxLength: 100
          example: "Pascual"
        active:
          type: boolean
          description: Whether the product is currently active.
          example: true
        category:
          $ref: '#/components/schemas/ProductCategorySummary'
        unitOfMeasure:
          $ref: '#/components/schemas/ProductUnitOfMeasureSummary'
        sellPrice:
          type: number
          format: double
          description: Current sell price of the product.
          example: 1.99
        mainImage:
          type: string
          format: uri
          description: URL of the main product image. Null if no image is assigned.
          maxLength: 2048
          example: "https://cdn.example.com/images/leche-entera.jpg"

    ProductCategorySummary:
      type: object
      description: Lightweight representation of a product category.
      properties:
        id:
          type: integer
          format: int64
          description: Unique identifier of the category.
          example: 10
        name:
          type: string
          description: Name of the category.
          maxLength: 100
          example: "Lácteos"

    ProductUnitOfMeasureSummary:
      type: object
      description: Lightweight representation of a unit of measure.
      properties:
        id:
          type: integer
          format: int64
          description: Unique identifier of the unit of measure.
          example: 1
        code:
          type: string
          description: Code of the unit of measure.
          maxLength: 50
          example: "LT"

