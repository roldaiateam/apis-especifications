get:
  tags:
    - Products
  summary: Get all product units
  description: |
    Retrieves the available unit names for products.
  operationId: getAllProductUnits
  responses:
    '200':
      description: Unit list retrieved successfully
      content:
        application/json:
          schema:
            $ref: '../../components/units/components.yml#/components/schemas/GetProductUnitsResponse'
    '400':
      $ref: '../../components/errors/components.yml#/components/responses/BadRequest'
    '401':
      $ref: '../../components/errors/components.yml#/components/responses/Unauthorized'
    '403':
      $ref: '../../components/errors/components.yml#/components/responses/Forbidden'
    '500':
      $ref: '../../components/errors/components.yml#/components/responses/InternalServerError'
