openapi: 3.0.3

info:
  title: Suppliers API
  description: Provides endpoints that allow tenants to manage supplier information for inventory operations
  contact:
    name: Proactive Devs team
    email: proactivedevs@gmail.com
    url: 'http://proactivedevs.com'
  version: 0.0.3

servers:
  - url: http://localhost:8090/mic-inventory
    description: Localhost
  - url: https://proactivedevs-template-des/mic-inventory
    description: DES
  - url: https://proactivedevs-template-pre/mic-inventory
    description: PRE
  - url: https://proactivedevs-template-prod/mic-inventory
    description: PRO

tags:
  - name: Suppliers
    description: Operations about Suppliers management

security:
  - basicAuth: []
  - bearerAuth: []

paths:
  /v1/suppliers:
    $ref: './v1/services/suppliers/suppliers-create.yml'
  /v1/suppliers/search:
    $ref: './v1/services/suppliers/suppliers-search.yml'


components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
