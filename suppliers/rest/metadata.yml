---
api-spec-type: rest

api:
  name: Suppliers REST API
  version: 0.0.3-unstable
  description: >
    This API provides endpoints to manage suppliers for tenant inventory workflows.
    It includes supplier creation with tenant-scoped uniqueness for name and tax ID.
  maintainer:
    name: Andres Reinaldo Cid
    email: andresrc345@gmail.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  basePath: /api/suppliers
  contact:
    name: Roldaia Team
    email: roldaiateam@gmail.com
  documentation:
    url: ./README.md

openapi:
  spec-version: 3.0.3
  spec-file: openapi-rest.yml
  format: openapi

codegen:
  package-prefix: com.proactivedevs.contracts.suppliers.rest.v1
  model-package: com.proactivedevs.contracts.suppliers.rest.v1.model

generators:
  mvn:
    enabled: true
    package_name: com.proactivedevs.contracts.suppliers.rest.v1
    artifact_id_override: null
  npm:
    enabled: false
    package_name: "@proactivedevs/contracts-suppliers-rest"
  go:
    enabled: false
  python:
    enabled: false
