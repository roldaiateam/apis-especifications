---
api-spec-type: rest

api:
  name: Provisioning REST API
  version: 0.0.2
  description: >
    This API provides endpoints to track tenant provisioning lifecycle in real time.
    It includes an SSE stream for provisioning events and a polling fallback for current status.
  maintainer:
    name: Andrés Reinaldo Cid
    email: andresrc345@gmail.com
  basePath: /micclients
  contact:
    name: Roldaia Team
    email: roldaiateam@gmail.com
  documentation:
    url: ./README.md

openapi:
  spec-version: 3.0.3
  spec-file: openapi-rest.yml
  format: openapi

codegen:
  package-prefix: com.proactivedevs.contracts.provisioning.rest.v1
  model-package: com.proactivedevs.contracts.provisioning.rest.v1.model

# Generator configurations
generators:
  mvn:
    enabled: true
    package_name: com.proactivedevs.contracts.provisioning.rest.v1
    artifact_id_override: null  # Use default naming
  npm:
    enabled: false  # Future implementation
    package_name: "@proactivedevs/contracts-provisioning-rest"
  go:
    enabled: false  # Future implementation
  python:
    enabled: false  # Future implementation
