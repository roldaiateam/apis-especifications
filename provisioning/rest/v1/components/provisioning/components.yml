components:
  schemas:
    TenantId:
      type: string
      format: uuid
      description: Unique identifier for a tenant.
      example: "123e4567-e89b-12d3-a456-426614174000"
    EventStream:
      type: string
      example: |
        event: provisioning.update
        data: {
          "status": "IN_PROGRESS",
          "progress": 40,
          "currentStep": "INVENTORY_SCHEMA_CREATED",
          "startedAt": "2026-02-18T10:12:03Z",
          "completedAt": null,
          "errorMessage": null,
          "timestamp": "2026-02-18T10:12:05Z"
        }
    TenantProvisioningStatus:
      type: object
      required:
        - isCompleted
      properties:
        isCompleted:
          type: boolean
          description: Indicates whether the tenant provisioning process is completed.
  parameters:
    SubscribeToTenantProvisioningEventsRequestTenantId:
      name: tenantId
      in: path
      description: Unique identifier of the tenant to subscribe for provisioning events.
      required: true
      schema:
        $ref: '#/components/schemas/TenantId'
    GetTenantProvisioningStatusRequestTenantId:
      name: tenantId
      in: path
      description: Unique identifier of the tenant to retrieve provisioning status for.
      required: true
      schema:
        $ref: '#/components/schemas/TenantId'
