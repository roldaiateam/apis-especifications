components:
  schemas:
    TenantId:
      type: string
      format: uuid
      description: Unique identifier for a tenant.
      example: "123e4567-e89b-12d3-a456-426614174000"
    EventStream:
      type: string
      example: |
        event: provisioning.update
        data: {
          "status": "IN_PROGRESS",
          "progress": 40,
          "currentStep": "INVENTORY_SCHEMA_CREATED",
          "startedAt": "2026-02-18T10:12:03Z",
          "completedAt": null,
          "errorMessage": null,
          "timestamp": "2026-02-18T10:12:05Z"
        }
    TenantProvisioningStatus:
      type: object
      required:
        - status
        - progress
        - currentStep
        - startedAt
        - completedAt
        - errorMessage
      properties:
        status:
          type: string
          description: Overall status of the provisioning process
          enum:
            - PENDING
            - IN_PROGRESS
            - COMPLETED
            - FAILED
          example: "IN_PROGRESS"
        progress:
          type: integer
          minimum: 0
          maximum: 100
          description: Completion percentage
          example: 40
        currentStep:
          type: string
          description: Name of the current provisioning step
          example: "INVENTORY_SCHEMA_CREATED"
        startedAt:
          type: string
          format: date-time
          description: Start date and time of the provisioning process
          example: "2026-02-18T10:12:03Z"
        completedAt:
          type: string
          format: date-time
          nullable: true
          description: Completion date and time of the provisioning process, or null if not completed
          example: "2026-02-18T10:12:05Z"
        errorMessage:
          type: string
          nullable: true
          description: Error message if the provisioning failed, or null otherwise
          example: "Failed to create inventory schema"
  parameters:
    SubscribeToTenantProvisioningEventsRequestTenantId:
      name: tenantId
      in: path
      description: Unique identifier of the tenant to subscribe for provisioning events.
      required: true
      schema:
        $ref: '#/components/schemas/TenantId'
    GetTenantProvisioningStatusRequestTenantId:
      name: tenantId
      in: path
      description: Unique identifier of the tenant to retrieve provisioning status for.
      required: true
      schema:
        $ref: '#/components/schemas/TenantId'
