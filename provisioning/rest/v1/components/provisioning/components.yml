components:
  schemas:
    TenantId:
      type: string
      format: uuid
      description: Unique identifier for a tenant.
      example: "123e4567-e89b-12d3-a456-426614174000"
    TenantProvisioningStatus:
      type: object
      required:
        - isCompleted
      properties:
        isCompleted:
          type: boolean
          description: Indicates whether the tenant provisioning process is completed.
          example: false

