get:
  tags:
    - Provisioning
  summary: Subscribe to tenant provisioning events
  description: >
    Establishes a Server-Sent Events (SSE) stream that emits
    real-time updates about the tenant provisioning process.
  operationId: subscribeToTenantProvisioningEvents
  parameters:
    - $ref: '../../components/provisioning/components.yml#/components/parameters/SubscribeToTenantProvisioningEventsRequestTenantId'
  responses:
    '200':
      description: Event stream established
      content:
        text/event-stream:
          schema:
            type: string