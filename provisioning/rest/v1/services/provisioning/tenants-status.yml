get:
  tags:
    - Provisioning
  summary: Get tenant provisioning status events
  description: |
    Returns the current state of the tenant provisioning process.
    This endpoint acts as a fallback mechanism if the SSE stream is unavailable.
  operationId: getTenantProvisioningStatus
  parameters:
    - $ref: '../../components/provisioning/components.yml#/components/parameters/GetTenantProvisioningStatusRequestTenantId'
  responses:
    '200':
      description: Event stream established
      content:
        text/event-stream:
          schema:
            $ref: '../../components/provisioning/components.yml#/components/schemas/GetTenantProvisioningStatusResponse'
    '400':
      $ref: '../../components/errors/components.yml#/components/responses/BadRequest'
    '401':
      $ref: '../../components/errors/components.yml#/components/responses/Unauthorized'
    '403':
      $ref: '../../components/errors/components.yml#/components/responses/Forbidden'
    '409':
      $ref: '../../components/errors/components.yml#/components/responses/Conflict'
    '500':
      $ref: '../../components/errors/components.yml#/components/responses/InternalServerError'
